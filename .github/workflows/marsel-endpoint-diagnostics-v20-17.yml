name: MARSEL V20.17 — Endpoint Diagnostics READ ONLY
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/marsel_api_endpoint_diagnostics_v20_17.py'
      - '.github/workflows/marsel-endpoint-diagnostics-v20-17.yml'
      - 'scripts/marsel_api_inventory_v20_14.py'
permissions:
  contents: read
jobs:
  diagnostics:
    name: V20.17 endpoint diagnostics — READ ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_TIMEOUT: '30'
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-14.json
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-14.json
      MARSEL_ENDPOINT_DIAGNOSTICS_OUTPUT: marsel-endpoint-diagnostics-v20-17.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Build API inventory — READ ONLY
        run: python scripts/marsel_api_inventory_v20_14.py
      - name: Run V20.17 endpoint diagnostics — READ ONLY
        run: python scripts/marsel_api_endpoint_diagnostics_v20_17.py
      - name: Verify read-only invariant
        run: |
          python - <<'PY'
          import json
          p=json.load(open('marsel-endpoint-diagnostics-v20-17.json',encoding='utf-8'))
          assert p['readonly'] is True
          assert p['write_requests_made']==0
          assert p['ro_app_data_mutated'] is False
          print('READ_ONLY_INVARIANTS=PASS')
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-17-endpoint-diagnostics-readonly
          path: |
            marsel-api-inventory-v20-14.json
            marsel-endpoint-diagnostics-v20-17.json
          if-no-files-found: error
          retention-days: 14
