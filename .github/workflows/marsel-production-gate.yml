name: MARSEL Production Gate

on:
  workflow_dispatch:
    inputs:
      unified_control_plane_run_id:
        description: 'Successful or completed MARSEL Unified Control Plane run ID to use for evidence'
        required: false
        type: string
  workflow_run:
    workflows: ["MARSEL Unified Control Plane"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  production-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      MARSEL_WRITE_APPROVED: "false"
      MARSEL_EVIDENCE_DIR: evidence
      UNIFIED_CONTROL_PLANE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.unified_control_plane_run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify production secret is not exposed in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            -e 'ROAPP_API_KEY[[:space:]]*=[[:space:]]*"[^\"]{12,}"' \
            -e "ROAPP_API_KEY[[:space:]]*=[[:space:]]*'[^']{12,}'" \
            -e 'Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' .; then
            echo 'Credential-like material detected in trusted source.'
            exit 1
          fi

      - name: Verify API key is only supplied by GitHub secret
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ROAPP_API_KEY:-}"

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p "$MARSEL_EVIDENCE_DIR"

      - name: Validate unified control-plane run ID
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UNIFIED_CONTROL_PLANE_RUN_ID:-}"
          case "$UNIFIED_CONTROL_PLANE_RUN_ID" in
            *[!0-9]*) echo 'unified_control_plane_run_id must be numeric.'; exit 1 ;;
          esac

      - name: Download unified control-plane evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.UNIFIED_CONTROL_PLANE_RUN_ID }}
          name: marsel-unified-evidence
          path: ${{ env.MARSEL_EVIDENCE_DIR }}

      - name: Record upstream control-plane conclusion
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          printf '%s\n' \
            "upstream_run_id=${{ github.event.workflow_run.id }}" \
            "upstream_conclusion=${{ github.event.workflow_run.conclusion }}" \
            "upstream_sha=${{ github.event.workflow_run.head_sha }}" \
            > "$MARSEL_EVIDENCE_DIR/unified-upstream-run.txt"

      - name: Run fail-closed Issue #19 gate
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: python scripts/marsel_production_gate_v1.py

      - name: Skip live secret gate for pull requests
        if: github.event_name == 'pull_request'
        run: echo 'Live production secret gate is intentionally skipped for pull_request events.'

      - name: Explicitly assert no production WRITE authorization
        run: |
          test "${MARSEL_WRITE_APPROVED:-false}" = "false"
          echo 'PRODUCTION_WRITE_AUTHORIZED=false'
