name: MARSEL Production Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify production secret is not exposed in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            'ROAPP_API_KEY[[:space:]]*=[[:space:]]*["'"'][^"'"']{12,}["'"']|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' .; then
            echo 'Credential-like material detected in tracked source.'
            exit 1
          fi

      - name: Verify API key is only supplied by GitHub secret
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ROAPP_API_KEY:-}"

      - name: Run fail-closed Issue #19 gate
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: python scripts/marsel_production_gate_v1.py

      - name: Skip live secret gate for pull requests
        if: github.event_name == 'pull_request'
        run: echo 'Live production secret gate is intentionally skipped for pull_request events.'

      - name: Explicitly assert no production WRITE authorization
        run: |
          test "${MARSEL_WRITE_APPROVED:-false}" = "false"
          echo 'PRODUCTION_WRITE_AUTHORIZED=false'
