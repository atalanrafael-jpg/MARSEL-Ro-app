name: MARSEL V20.22 Strict API Endpoint Diagnostics — READ ONLY

on:
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: 'Successful V20.22 API inventory workflow run ID'
        required: true
        type: string
  workflow_run:
    workflows:
      - 'MARSEL V20.22 Official API Inventory — READ ONLY'
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: marsel-api-endpoint-diagnostics-v20-22
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Strict endpoint diagnostics — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-22.json
      MARSEL_ENDPOINT_DIAGNOSTICS_OUTPUT: marsel-endpoint-diagnostics-v20-18.json
      ROAPP_PATH_PARAMS_JSON: '{}'
      INVENTORY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.inventory_run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check --no-input 'httpx>=0.28,<1'
      - name: Verify configuration
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          test -n "$INVENTORY_RUN_ID"
      - name: Download V20.22 inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: marsel-v20-22-api-inventory
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INVENTORY_RUN_ID }}
      - name: Verify inventory artifact
        run: |
          set -euo pipefail
          test -s "$MARSEL_API_INVENTORY_INPUT"
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['MARSEL_API_INVENTORY_INPUT'],encoding='utf-8'))
          assert d.get('version')=='20.22'
          assert d.get('readonly') is True
          assert d.get('write_requests_made')==0 and d.get('ro_app_data_mutated') is False
          assert d.get('method_policy',{}).get('allowed')==['GET']
          assert d.get('completeness',{}).get('never_guess_identifiers') is True
          print('INVENTORY_ARTIFACT=VALID')
          print('DOCUMENTED_OPERATIONS=',d['summary']['documented_operations'])
          print('EXTRACTED_PATHS=',d['summary']['operations_with_extracted_paths'])
          print('COMPLETENESS=',d['completeness']['status'])
          PY
      - name: Run strict read-only diagnostics
        run: python scripts/marsel_api_endpoint_diagnostics_v20_18.py
      - name: Validate report safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('marsel-endpoint-diagnostics-v20-18.json',encoding='utf-8'))
          assert d['version']=='20.18' and d['readonly'] is True
          assert d['write_requests_made']==0 and d['ro_app_data_mutated'] is False
          assert d['parameter_resolution']['never_guess_identifiers'] is True
          assert d['summary']['unique_concrete_get_paths'] >= 1 or d['summary']['unique_parameterized_get_templates'] >= 1
          print('VALIDATION=PASS')
          print('CONCRETE_GET_PATHS=',d['summary']['unique_concrete_get_paths'])
          print('PARAMETERIZED_GET_TEMPLATES=',d['summary']['unique_parameterized_get_templates'])
          print('PATHS_ATTEMPTED=',d['summary']['paths_attempted'])
          print('PATHS_NOT_ATTEMPTED_MISSING_PARAMETERS=',d['summary']['paths_not_attempted_missing_parameters'])
          print('CLASSIFICATIONS=',d['summary']['classifications'])
          print('WRITE_REQUESTS=',d['write_requests_made'])
          print('RO_APP_DATA_MUTATED=',d['ro_app_data_mutated'])
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-22-endpoint-diagnostics
          path: marsel-endpoint-diagnostics-v20-18.json
          if-no-files-found: error
