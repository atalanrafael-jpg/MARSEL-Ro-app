name: MARSEL V20.31 Corrected API Inventory — READ ONLY

on:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_api_inventory_v20_31.py'
      - 'scripts/marsel_api_inventory_v20_29.py'
      - '.github/workflows/marsel-api-v20-30-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marsel-readonly-api-audit-v20-31
  cancel-in-progress: true

jobs:
  readonly-audit:
    name: V20.31 strict inventory — GET only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify API configuration
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Run V20.31 strict inventory
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEXES: https://roapp.readme.io/llms.txt,https://roappua.readme.io/llms.txt
          MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-31.json
          ROAPP_MIN_REQUEST_INTERVAL: '0.34'
          MARSEL_INVENTORY_BUDGET_SECONDS: '150'
        run: python scripts/marsel_api_inventory_v20_31.py
      - name: Enforce strict read-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-31.json',encoding='utf-8'))
          assert d['readonly'] is True
          assert d['method_policy']['allowed'] == ['GET']
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          print('V20_31_READ_ONLY=PASS')
          print('V20_31_CONFIRMED_OPERATIONS=', len(d['operations']))
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=false')
          PY
      - name: Write SHA-256 evidence
        shell: bash
        run: sha256sum marsel-api-inventory-v20-31.json > marsel-v20-31-sha256.txt
      - name: Upload V20.31 evidence
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-31-readonly-evidence
          path: |
            marsel-api-inventory-v20-31.json
            marsel-v20-31-sha256.txt
          if-no-files-found: error
          retention-days: 90
