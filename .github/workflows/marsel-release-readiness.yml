name: MARSEL release readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marsel-release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile control scripts
        run: python -m compileall -q scripts
      - name: Canonical self-check
        run: python scripts/marsel_canonical_self_check.py
      - name: Verify repository release controls
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              '.github/workflows/mcp-production.yml',
              'scripts/marsel_canonical_self_check.py',
              'scripts/marsel_production_gate_v1.py',
              'docs/MARSEL-PRODUCTION-GO-LIVE-GATES.md',
              'docs/MARSEL_ROAPP_TASK_REGISTRY.md',
              'SECURITY.md',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Missing required controls: {missing}')
          print('REPOSITORY_CONTROLS=PASS')
          PY
      - name: Release readiness check with real external evidence
        if: github.event_name != 'pull_request'
        env:
          MARSEL_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: python scripts/marsel_release_readiness_v1.py
      - name: PR-safe release evidence policy
        if: github.event_name == 'pull_request'
        run: |
          echo "EXTERNAL_EVIDENCE=NOT_REQUIRED_FOR_PR_REVIEW"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"
          echo "RESULT=PR_SAFE_REVIEW"
          echo "EVIDENCE_INFRASTRUCTURE=READY"
      - name: Production gate must remain fail-closed
        if: github.event_name != 'pull_request'
        env:
          MARSEL_WRITE_APPROVED: "true"
          MARSEL_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: |
          if python scripts/marsel_production_gate_v1.py; then
            echo "Production gate incorrectly accepted write approval" >&2
            exit 1
          fi
      - name: Production gate sanity check (PR mode - should fail gracefully)
        if: github.event_name == 'pull_request'
        env:
          MARSEL_WRITE_APPROVED: "true"
          MARSEL_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        run: |
          python scripts/marsel_production_gate_v1.py && exit 1 || echo "Production gate correctly rejected (PR mode)"
