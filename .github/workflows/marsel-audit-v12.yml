name: MARSEL Audit V12

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/marsel_audit_v12.py'
      - '.github/workflows/marsel-audit-v12.yml'
      - 'requirements-audit-v12.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -r requirements-audit-v12.txt
      - name: Run V12 read-only audit
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v12.py --readonly
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-audit-v12-report
          path: marsel-api-master-inventory-v12.json
          if-no-files-found: error
