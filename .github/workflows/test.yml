name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long --maxfail=1 --junitxml=pytest-results.xml | tee pytest-output.txt
      - name: Build test manifest
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}";
            echo "run=${GITHUB_RUN_ID}";
            echo "workflow=${GITHUB_WORKFLOW}";
            echo "python=$(python --version 2>&1)";
            echo "pytest=$(python -m pytest --version 2>&1)";
          } > test-manifest.txt
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marsel-test-evidence-${{ github.run_id }}
          path: |
            pytest-results.xml
            pytest-output.txt
            test-manifest.txt
          if-no-files-found: warn
          retention-days: 90
