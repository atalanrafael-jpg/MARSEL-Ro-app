name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -vv --tb=long --maxfail=1

  warehouse-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install warehouse audit dependency
        run: python -m pip install --disable-pip-version-check --no-input httpx
      - name: Verify RO App secret
        run: test -n "$ROAPP_API_KEY"
      - name: Run warehouse contract audit (READ ONLY)
        run: python scripts/marsel_warehouse_contract_v20_36.py
      - name: Enforce warehouse contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("marsel-unified-warehouse-contract.json")
          if not p.exists():
              raise SystemExit("Warehouse evidence file is missing")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report.get("mode") == "READ_ONLY"
          assert report.get("readonly") is True
          assert report.get("write_requests_made") == 0
          assert report.get("ro_app_data_mutated") is False
          assert report.get("result") == "PASS"
          assert report.get("warehouse_count", 0) > 0
          assert report.get("confirmed_live_gets")
          print("WAREHOUSE_CONTRACT_FINAL=PASS")
          PY
      - name: Upload warehouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsel-warehouse-contract
          path: marsel-unified-warehouse-contract.json
          retention-days: 90
