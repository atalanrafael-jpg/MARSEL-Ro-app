name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

      # Secrets are intentionally not used on pull_request runs.
      # The API audits therefore run on push and manual workflow_dispatch runs.
      - name: RO App API read-only smoke test
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          python - <<'PY'
          import os,sys,httpx
          api_key=os.environ.get("ROAPP_API_KEY")
          if not api_key: print("ROAPP_API_KEY GitHub Secret is not configured."); sys.exit(1)
          response=httpx.get("https://api.roapp.io/v2/orders",params={"page":1},headers={"Authorization":f"Bearer {api_key}"},timeout=20.0)
          print(f"RO App API HTTP status: {response.status_code}")
          if not 200 <= response.status_code < 300: sys.exit(1)
          try: payload=response.json()
          except ValueError: print("RO App API returned a non-JSON response."); sys.exit(1)
          print(f"RO App API JSON top-level type: {type(payload).__name__}")
          print("RO App API read-only request succeeded.")
          PY

      - name: MARSEL read-only orders audit
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: python scripts/marsel_orders_audit_v20_20.py

      - name: MARSEL master audit v20.20
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          MARSEL_MAX_ORDER_PAGES: "100"
        run: python scripts/marsel_master_audit_v20_20.py

      - name: MARSEL API inventory + V20.36 bounded paginated entity audit
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_TIMEOUT: 12
          ROAPP_DOCS_INDEXES: https://roapp.readme.io/llms.txt,https://roappua.readme.io/llms.txt
          ROAPP_MIN_REQUEST_INTERVAL: '0.34'
          MARSEL_INVENTORY_BUDGET_SECONDS: '240'
          MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-29.json
          MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-29.json
          MARSEL_ENTITY_INVENTORY_OUTPUT: marsel-entity-inventory-v20-19.json
          MARSEL_MAX_IDS_PER_COLLECTION: '3'
          MARSEL_MAX_DETAIL_PROBES: '50'
          MARSEL_MAX_PAGES_PER_COLLECTION: '50'
          MARSEL_MAX_RECORDS_PER_COLLECTION: '5000'
          MARSEL_PAGE_LIMIT: '50'
        run: |
          python scripts/marsel_api_inventory_v20_31.py
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-29.json',encoding='utf-8'))
          assert d.get('readonly') is True
          assert d.get('write_requests_made',0)==0
          assert d.get('ro_app_data_mutated') is False
          assert ((d.get('safety') or {}).get('write_methods_used') or []) == []
          assert d.get('contract_state',{}).get('parameterized_identifiers_guessed') is False
          print('API_INVENTORY_SAFETY=PASS')
          PY
          python scripts/marsel_entity_inventory_v20_19.py
          python - <<'PY'
          import json
          d=json.load(open('marsel-entity-inventory-v20-19.json',encoding='utf-8'))
          assert d['version']=='20.36'
          assert d['mode']=='READ_ONLY'
          assert d['write_requests']==0
          assert d['ro_app_data_mutated'] is False
          assert d['write_methods_used']==[]
          assert d['parameterized_identifiers_guessed'] is False
          assert d['audit_status']=='PASS'
          print('ENTITY_AUDIT_SAFETY=PASS')
          print('COLLECTION_PAGES_FETCHED=',sum(x['pages_fetched'] for x in d['collection_stats'].values()))
          print('COLLECTION_RECORDS_FETCHED=',sum(x['records_fetched'] for x in d['collection_stats'].values()))
          print('DUPLICATE_CANDIDATE_GROUPS=',d['duplicate_candidate_groups'])
          PY

      - name: Upload MARSEL audit reports
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: marsel-audit-v20-36
          path: |
            marsel-api-inventory-v20-29.json
            marsel-entity-inventory-v20-19.json
          if-no-files-found: warn
          retention-days: 7
