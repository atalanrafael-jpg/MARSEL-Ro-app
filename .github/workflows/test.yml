name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

      # Secrets are intentionally not used on pull_request runs.
      # The API audits therefore run on push and manual workflow_dispatch runs.
      - name: RO App API read-only smoke test
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import httpx

          api_key = os.environ.get("ROAPP_API_KEY")
          if not api_key:
              print("ROAPP_API_KEY GitHub Secret is not configured.")
              sys.exit(1)

          response = httpx.get(
              "https://api.roapp.io/v2/orders",
              params={"page": 1},
              headers={"Authorization": f"Bearer {api_key}"},
              timeout=20.0,
          )
          print(f"RO App API HTTP status: {response.status_code}")
          print(f"RO App API content-type: {response.headers.get('content-type', '')}")
          if not 200 <= response.status_code < 300:
              print("RO App API read-only request failed; response body is intentionally not printed.")
              sys.exit(1)
          try:
              payload = response.json()
          except ValueError:
              print("RO App API returned a non-JSON response.")
              sys.exit(1)
          print(f"RO App API JSON top-level type: {type(payload).__name__}")
          print("RO App API read-only request succeeded.")
          PY

      - name: MARSEL read-only orders audit
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from collections import Counter
          import httpx

          BASE = "https://api.roapp.io/v2"
          KEY = os.environ.get("ROAPP_API_KEY")
          if not KEY:
              print("AUDIT: ROAPP_API_KEY GitHub Secret is not configured.")
              sys.exit(1)

          headers = {"Authorization": f"Bearer {KEY}"}
          page = 1
          page_size = 50
          orders = []

          with httpx.Client(timeout=30.0) as client:
              while True:
                  response = client.get(
                      f"{BASE}/orders",
                      params={"page": page, "pageSize": page_size},
                      headers=headers,
                  )
                  print(f"AUDIT page={page} HTTP={response.status_code}")
                  if not 200 <= response.status_code < 300:
                      print("AUDIT stopped: non-success response; response body is intentionally not printed.")
                      sys.exit(1)
                  try:
                      payload = response.json()
                  except ValueError:
                      print("AUDIT stopped: non-JSON response.")
                      sys.exit(1)

                  if isinstance(payload, dict):
                      rows = payload.get("orders")
                      if rows is None:
                          rows = payload.get("data")
                  elif isinstance(payload, list):
                      rows = payload
                  else:
                      rows = None

                  if not isinstance(rows, list):
                      print("AUDIT stopped: could not identify an order list in the JSON response.")
                      print(f"AUDIT top-level keys: {sorted(payload.keys()) if isinstance(payload, dict) else 'n/a'}")
                      sys.exit(1)

                  orders.extend(x for x in rows if isinstance(x, dict))
                  if len(rows) < page_size:
                      break
                  page += 1
                  time.sleep(0.4)

          ids = [x.get("id") for x in orders if x.get("id") is not None]
          id_counts = Counter(ids)
          duplicate_ids = sum(1 for value in id_counts.values() if value > 1)
          missing_id = sum(1 for x in orders if x.get("id") is None)

          # RO App returns client and status as nested objects, not client_id/status_id.
          clients = [x.get("client") for x in orders]
          missing_client = sum(
              1 for client in clients
              if not isinstance(client, dict) or client.get("id") is None
          )
          statuses = Counter(
              str(status.get("id"))
              for status in (x.get("status") for x in orders)
              if isinstance(status, dict) and status.get("id") is not None
          )
          missing_status = sum(
              1 for x in orders
              if not isinstance(x.get("status"), dict) or x["status"].get("id") is None
          )

          numbers = [x.get("number") for x in orders if x.get("number") not in (None, "")]
          number_counts = Counter(numbers)
          duplicate_number_groups = sum(1 for value in number_counts.values() if value > 1)
          missing_number = sum(1 for x in orders if x.get("number") in (None, ""))

          print("=== MARSEL_DATA_AUDIT / READ ONLY ===")
          print(f"pages_read={page}")
          print(f"orders_total={len(orders)}")
          print(f"unique_order_ids={len(id_counts)}")
          print(f"duplicate_order_id_groups={duplicate_ids}")
          print(f"orders_missing_id={missing_id}")
          print(f"orders_missing_client={missing_client}")
          print(f"status_groups={len(statuses)}")
          print("status_counts=" + ",".join(f"{k}:{v}" for k, v in sorted(statuses.items())))
          print(f"orders_missing_status={missing_status}")
          print(f"duplicate_order_number_groups={duplicate_number_groups}")
          print(f"orders_missing_number={missing_number}")
          print("AUDIT RESULT: READ-ONLY; NO RO APP DATA WAS CREATED, UPDATED OR DELETED.")
          PY

      - name: MARSEL read-only order schema audit v2
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import httpx

          BASE = "https://api.roapp.io/v2"
          KEY = os.environ.get("ROAPP_API_KEY")
          if not KEY:
              print("SCHEMA AUDIT: ROAPP_API_KEY GitHub Secret is not configured.")
              sys.exit(1)

          headers = {"Authorization": f"Bearer {KEY}"}
          response = httpx.get(
              f"{BASE}/orders",
              params={"page": 1, "pageSize": 1},
              headers=headers,
              timeout=30.0,
          )
          print(f"SCHEMA page=1 HTTP={response.status_code}")
          if not 200 <= response.status_code < 300:
              print("SCHEMA audit stopped: non-success response; response body is intentionally not printed.")
              sys.exit(1)

          try:
              payload = response.json()
          except ValueError:
              print("SCHEMA audit stopped: non-JSON response.")
              sys.exit(1)

          if isinstance(payload, dict):
              rows = payload.get("orders")
              if rows is None:
                  rows = payload.get("data")
          elif isinstance(payload, list):
              rows = payload
          else:
              rows = None

          if not isinstance(rows, list) or not rows or not isinstance(rows[0], dict):
              print("SCHEMA audit stopped: could not identify a sample order object.")
              print(f"SCHEMA top-level keys: {sorted(payload.keys()) if isinstance(payload, dict) else 'n/a'}")
              sys.exit(1)

          sample = rows[0]

          def type_name(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "bool"
              if isinstance(value, int) and not isinstance(value, bool):
                  return "int"
              if isinstance(value, float):
                  return "float"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, list):
                  return "list"
              if isinstance(value, dict):
                  return "object"
              return type(value).__name__

          def print_schema(obj, prefix="", depth=0, max_depth=3):
              if not isinstance(obj, dict):
                  return
              for key in sorted(obj):
                  value = obj[key]
                  path = f"{prefix}.{key}" if prefix else key
                  print(f"SCHEMA field={path} type={type_name(value)}")
                  if depth < max_depth and isinstance(value, dict):
                      print_schema(value, path, depth + 1, max_depth)
                  elif depth < max_depth and isinstance(value, list) and value and isinstance(value[0], dict):
                      print_schema(value[0], path + "[]", depth + 1, max_depth)

          print("=== MARSEL_ORDER_SCHEMA_AUDIT_V2 / READ ONLY ===")
          if isinstance(payload, dict):
              print("SCHEMA top_level_keys=" + ",".join(sorted(payload.keys())))
          print("SCHEMA order_keys=" + ",".join(sorted(sample.keys())))
          print_schema(sample)
          print("SCHEMA RESULT: READ-ONLY; VALUES ARE NOT PRINTED; NO RO APP DATA WAS CREATED, UPDATED OR DELETED.")
          PY
