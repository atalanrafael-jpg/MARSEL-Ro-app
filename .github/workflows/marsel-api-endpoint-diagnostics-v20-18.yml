name: MARSEL V20.18 Strict API Endpoint Diagnostics — READ ONLY

on:
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: 'Successful V20.14 workflow run ID containing marsel-v20-14-api-inventory'
        required: true
        type: string
  workflow_run:
    workflows:
      - 'MARSEL V20.14 Official API Inventory — READ ONLY'
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: marsel-api-endpoint-diagnostics-v20-18
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Strict endpoint diagnostics — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-14.json
      MARSEL_ENDPOINT_DIAGNOSTICS_OUTPUT: marsel-endpoint-diagnostics-v20-18.json
      ROAPP_PATH_PARAMS_JSON: '{}'
      INVENTORY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.inventory_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          test -n "$INVENTORY_RUN_ID"
          python --version
          echo "INVENTORY_RUN_ID=$INVENTORY_RUN_ID"

      - name: Download V20.14 inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: marsel-v20-14-api-inventory
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INVENTORY_RUN_ID }}

      - name: Verify inventory artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MARSEL_API_INVENTORY_INPUT"
          python - <<'PY'
          import json, os
          p=os.environ['MARSEL_API_INVENTORY_INPUT']
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('version') == '20.14'
          assert d.get('readonly') is True
          assert d.get('write_requests_made') == 0
          assert d.get('ro_app_data_mutated') is False
          assert d.get('method_policy', {}).get('allowed') == ['GET']
          print('INVENTORY_ARTIFACT=VALID')
          print('DOCUMENTED_OPERATIONS=', d.get('summary', {}).get('documented_operations'))
          print('EXTRACTED_PATHS=', d.get('summary', {}).get('operations_with_extracted_paths'))
          print('INVENTORY_SHA256=', d.get('summary', {}).get('inventory_sha256'))
          PY

      - name: Run V20.18 strict read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marsel_api_endpoint_diagnostics_v20_18.py

      - name: Validate report safety and completeness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='marsel-endpoint-diagnostics-v20-18.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d['version'] == '20.18'
          assert d['readonly'] is True
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['parameter_resolution']['never_guess_identifiers'] is True
          assert d['api_base'].rstrip('/') == 'https://api.roapp.io/v2'
          assert '/v2/v2' not in d['api_base']
          assert d['summary']['unique_concrete_get_paths'] >= 1
          print('VALIDATION=PASS')
          print('CONCRETE_GET_PATHS=', d['summary']['unique_concrete_get_paths'])
          print('PARAMETERIZED_GET_TEMPLATES=', d['summary']['unique_parameterized_get_templates'])
          print('PATHS_ATTEMPTED=', d['summary']['paths_attempted'])
          print('PATHS_NOT_ATTEMPTED_MISSING_PARAMETERS=', d['summary']['paths_not_attempted_missing_parameters'])
          print('CLASSIFICATIONS=', d['summary']['classifications'])
          print('WRITE_REQUESTS=', d['write_requests_made'])
          print('RO_APP_DATA_MUTATED=', d['ro_app_data_mutated'])
          print('REPORT_SHA256=', d['report_sha256'])
          PY

      - name: Upload V20.18 diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-18-endpoint-diagnostics
          path: marsel-endpoint-diagnostics-v20-18.json
          if-no-files-found: error
          compression-level: 6
