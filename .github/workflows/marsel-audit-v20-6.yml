name: MARSEL V20.6 full read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v20_6.py'
      - '.github/workflows/marsel-audit-v20-6.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      MARSEL_AUDIT_OUTPUT: marsel-data-discovery-v20-6.json
      MARSEL_PAGE_SIZE: '100'
      MARSEL_MAX_PAGES: '1000'
      MARSEL_MAX_DETAIL: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run MARSEL V20.6 read-only audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v20_6.py --readonly
      - name: Upload V20.6 report
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-6-audit
          if-no-files-found: error
          path: marsel-data-discovery-v20-6.json
          compression-level: 6
