name: MARSEL V18 — Live Structural Data Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v18.py'
      - '.github/workflows/marsel-v18.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V18
        run: python -m py_compile scripts/marsel_audit_v18.py

      - name: Run MARSEL V18 read-only audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v18.py --readonly

      - name: Upload V18 report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-structural-data-audit-v18
          path: marsel-structural-data-audit-v18.json
          if-no-files-found: error
