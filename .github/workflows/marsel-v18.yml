name: MARSEL V18 — Live Structural API Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v18.py'
      - '.github/workflows/marsel-v18.yml'

permissions:
  contents: read

jobs:
  audit:
    name: V18 read-only API discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Compile V18
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/marsel_audit_v18.py
          echo "PY_COMPILE=OK"

      - name: Run V18 GET-only audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v18.py --readonly

      - name: Upload V18 report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marsel-live-api-readonly-v18
          path: marsel-live-api-readonly-v18.json
          if-no-files-found: error
