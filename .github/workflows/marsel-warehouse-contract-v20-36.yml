name: MARSEL Warehouse Contract V20.44

# READ-ONLY live contract verification.
# The workflow must report external API mismatches without converting them into
# false PASS results or failing the entire CI pipeline.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/marsel_warehouse_contract_v20_36.py'
      - '.github/workflows/marsel-warehouse-contract-v20-36.yml'
  pull_request:
    paths:
      - 'scripts/marsel_warehouse_contract_v20_36.py'
      - '.github/workflows/marsel-warehouse-contract-v20-36.yml'

concurrency:
  group: marsel-warehouse-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify secret
        run: test -n "$ROAPP_API_KEY"
      - name: Run warehouse contract audit (READ ONLY)
        run: python scripts/marsel_warehouse_contract_v20_36.py
      - name: Validate safety invariants
        run: |
          python - <<'PY'
          import json
          report=json.load(open('marsel-unified-warehouse-contract.json',encoding='utf-8'))
          assert report.get('mode') == 'READ_ONLY'
          assert report.get('readonly') is True
          assert report.get('write_requests_made') == 0
          assert report.get('ro_app_data_mutated') is False
          result=report.get('result')
          assert result in {'PASS','NOT_VERIFIED'}
          print(f'WAREHOUSE_CONTRACT_AUDIT={result}')
          if result == 'NOT_VERIFIED':
              print('WAREHOUSE_CONTRACT_BLOCKED=external API contract not proven live')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsel-warehouse-contract-v20-44
          path: marsel-unified-warehouse-contract.json
          retention-days: 90
