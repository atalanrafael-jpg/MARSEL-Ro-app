name: MARSEL V21.3 Entity Mapping (READ ONLY)

on:
  push:
    paths:
      - 'scripts/marsel_entity_mapping_v21_3.py'
      - 'docs/MARSEL_INVENTORY_TAXONOMY_V21_2.md'
      - '.github/workflows/marsel-entity-mapping-v21-3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mapping:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      MARSEL_ENTITY_MAPPING_OUTPUT: marsel-entity-mapping-v21-3.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest successful V20.19 inventory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/marsel-entity-inventory-v20-19.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id')
          test -n "$run_id"
          gh run download "$run_id" -n marsel-v20-19-entity-inventory -D .
          test -f marsel-entity-inventory-v20-19.json
          echo "SOURCE_RUN_ID=$run_id"

      - name: Run V21.3 read-only mapping
        run: python scripts/marsel_entity_mapping_v21_3.py

      - name: Safety gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='marsel-entity-mapping-v21-3.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['write_requests'] == 0
          assert d['ro_app_data_mutated'] is False
          print('SAFETY_GATE=PASS')
          print('REVIEW_REQUIRED=', d['review_required'])
          PY

      - name: Upload mapping report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v21-3-entity-mapping
          path: marsel-entity-mapping-v21-3.json
          if-no-files-found: error
