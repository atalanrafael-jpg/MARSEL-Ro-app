name: MCP production readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify canonical MARSEL ROAPP repository
        run: python scripts/marsel_canonical_self_check.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app mcp_server.py tests
      - name: Run tests
        run: python -m pytest -vv --tb=long --maxfail=1
      - name: MCP import smoke test
        run: python -c "from app.main import app; from app.mcp_server import create_local_mcp_server; s=create_local_mcp_server(); print(app.title, s.name)"
      - name: Dependency vulnerability audit
        run: python -m pip install --disable-pip-version-check --no-input pip-audit && pip-audit -r requirements.txt
