name: MCP production readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app mcp_server.py tests
      - name: Run tests
        run: python -m pytest -vv --tb=long --maxfail=1
      - name: MCP import smoke test
        run: python -c "from app.main import app; from app.mcp_server import create_local_mcp_server; s=create_local_mcp_server(); print(app.title, s.name)"
      - name: Dependency vulnerability audit
        run: python -m pip install --disable-pip-version-check --no-input pip-audit && pip-audit -r requirements.txt
