name: MARSEL V20.15 — Data Quality Audit READ ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/marsel-data-quality-v20-15.yml'
      - 'scripts/marsel_data_quality_v20_15.py'

permissions:
  contents: read

jobs:
  data-quality:
    name: MARSEL Data Quality — READ ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          echo 'ROAPP_API_KEY is configured.'

      - name: Run V20.15 READ ONLY audit
        run: python scripts/marsel_data_quality_v20_15.py
