name: MARSEL audit v3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx

      - name: MARSEL read-only orders audit v3
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from collections import Counter
          from datetime import datetime, timezone
          import httpx

          BASE = "https://api.roapp.io/v2"
          KEY = os.environ.get("ROAPP_API_KEY")
          if not KEY:
              print("AUDIT V3: ROAPP_API_KEY GitHub Secret is not configured.")
              sys.exit(1)

          headers = {"Authorization": f"Bearer {KEY}"}
          page = 1
          page_size = 50
          orders = []

          def get_rows(payload):
              if isinstance(payload, dict):
                  rows = payload.get("data")
                  if rows is None:
                      rows = payload.get("orders")
              elif isinstance(payload, list):
                  rows = payload
              else:
                  rows = None
              return rows if isinstance(rows, list) else None

          with httpx.Client(timeout=30.0) as client:
              while True:
                  response = client.get(
                      f"{BASE}/orders",
                      params={"page": page, "pageSize": page_size},
                      headers=headers,
                  )
                  print(f"AUDIT_V3 page={page} HTTP={response.status_code}")
                  if not 200 <= response.status_code < 300:
                      print("AUDIT_V3 stopped: non-success response; response body is intentionally not printed.")
                      sys.exit(1)
                  try:
                      payload = response.json()
                  except ValueError:
                      print("AUDIT_V3 stopped: non-JSON response.")
                      sys.exit(1)
                  rows = get_rows(payload)
                  if rows is None:
                      print("AUDIT_V3 stopped: could not identify an order list.")
                      sys.exit(1)
                  orders.extend(x for x in rows if isinstance(x, dict))
                  if len(rows) < page_size:
                      break
                  page += 1
                  time.sleep(0.4)

          def nested_id(obj, key):
              value = obj.get(key)
              return value.get("id") if isinstance(value, dict) else None

          def nested_name(obj, key):
              value = obj.get(key)
              return value.get("name") if isinstance(value, dict) else None

          def parse_date(value):
              if not isinstance(value, str) or not value.strip():
                  return None
              text = value.strip().replace("Z", "+00:00")
              try:
                  dt = datetime.fromisoformat(text)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt
              except ValueError:
                  return None

          ids = [x.get("id") for x in orders if x.get("id") is not None]
          numbers = [x.get("number") for x in orders if x.get("number") not in (None, "")]
          clients = [nested_id(x, "client") for x in orders]
          statuses = [(nested_id(x, "status"), nested_name(x, "status")) for x in orders]
          order_types = [(nested_id(x, "order_type"), nested_name(x, "order_type")) for x in orders]
          branches = [x.get("branch_id") for x in orders]
          assignees = [x.get("assignee_id") for x in orders]
          managers = [x.get("manager_id") for x in orders]

          def duplicate_groups(values):
              counts = Counter(v for v in values if v is not None)
              return sum(1 for v in counts.values() if v > 1)

          missing_client = sum(v is None for v in clients)
          missing_status = sum(a is None for a, _ in statuses)
          missing_branch = sum(v is None for v in branches)
          missing_assignee = sum(v is None for v in assignees)
          missing_manager = sum(v is None for v in managers)
          missing_number = sum(x.get("number") in (None, "") for x in orders)
          missing_total = sum(x.get("total") in (None, "") for x in orders)
          missing_type = sum(a is None for a, _ in order_types)
          overdue_flag = sum(x.get("overdue") is True for x in orders)
          status_overdue_flag = sum(x.get("status_overdue") is True for x in orders)

          malformed_dates = Counter()
          past_due_dates = 0
          now = datetime.now(timezone.utc)
          for x in orders:
              for field in ("created_at", "modified_at", "due_date", "done_at", "closed_at", "scheduled_for", "scheduled_to", "warranty_date"):
                  value = x.get(field)
                  if value not in (None, "") and parse_date(value) is None:
                      malformed_dates[field] += 1
              due = parse_date(x.get("due_date"))
              if due is not None and due < now:
                  past_due_dates += 1

          print("=== MARSEL_DATA_AUDIT_V3 / READ ONLY ===")
          print(f"pages_read={page}")
          print(f"orders_total={len(orders)}")
          print(f"unique_order_ids={len(set(ids))}")
          print(f"duplicate_order_id_groups={duplicate_groups(ids)}")
          print(f"orders_missing_id={sum(x.get('id') is None for x in orders)}")
          print(f"unique_order_numbers={len(set(numbers))}")
          print(f"duplicate_order_number_groups={duplicate_groups(numbers)}")
          print(f"orders_missing_number={missing_number}")
          print(f"orders_missing_client={missing_client}")
          print(f"orders_missing_status={missing_status}")
          print(f"orders_missing_order_type={missing_type}")
          print(f"orders_missing_branch_id={missing_branch}")
          print(f"orders_missing_assignee_id={missing_assignee}")
          print(f"orders_missing_manager_id={missing_manager}")
          print(f"orders_missing_total={missing_total}")
          print(f"overdue_true_count={overdue_flag}")
          print(f"status_overdue_true_count={status_overdue_flag}")
          print(f"records_with_due_date_in_past={past_due_dates}")
          print("status_counts=" + ",".join(f"{sid}:{name}:{count}" for (sid, name), count in sorted(Counter(statuses).items(), key=lambda item: str(item[0]))))
          print("order_type_counts=" + ",".join(f"{oid}:{name}:{count}" for (oid, name), count in sorted(Counter(order_types).items(), key=lambda item: str(item[0]))))
          print("branch_counts=" + ",".join(f"{k}:{v}" for k, v in sorted(Counter(branches).items(), key=lambda item: str(item[0]))))
          print("malformed_date_counts=" + ",".join(f"{k}:{v}" for k, v in sorted(malformed_dates.items())))
          print("AUDIT_V3 RESULT: READ-ONLY; NO RO APP DATA WAS CREATED, UPDATED OR DELETED.")
          PY
