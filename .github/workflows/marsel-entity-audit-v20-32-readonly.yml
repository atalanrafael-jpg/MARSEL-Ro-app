name: MARSEL V20.32 Entity/Data Quality — strict READ-ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  entity_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      MARSEL_ENTITY_AUDIT_OUTPUT: marsel-entity-audit-v20-32.json
      ROAPP_TIMEOUT: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify API configuration
        run: test -n "$ROAPP_API_KEY"
      - name: Run evidence-gated entity audit
        run: python scripts/marsel_entity_audit_v20_32.py
      - name: Enforce READ-ONLY safety
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-entity-audit-v20-32.json',encoding='utf-8'))
          assert d['readonly'] is True
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['safety']['identifiers_guessed'] is False
          print('READ_ONLY_SAFETY=PASS')
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=false')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-32-entity-audit-readonly
          path: marsel-entity-audit-v20-32.json
          if-no-files-found: error
          retention-days: 90
