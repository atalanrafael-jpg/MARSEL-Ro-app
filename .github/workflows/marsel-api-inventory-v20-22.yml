name: MARSEL V20.22 Official API Inventory — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_api_inventory_v20_22.py'
      - '.github/workflows/marsel-api-inventory-v20-22.yml'

permissions:
  contents: read

concurrency:
  group: marsel-api-inventory-v20-22
  cancel-in-progress: true

jobs:
  inventory:
    name: Official API inventory — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
      ROAPP_TIMEOUT: '30'
      ROAPP_MIN_REQUEST_INTERVAL: '0.34'
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-22.json
      MARSEL_MAX_DOCS: '300'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify configuration
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Check official documentation availability
        id: docs
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o /tmp/roapp-llms.txt -w '%{http_code}' --max-time 30 -A 'MARSEL-Audit-V20.22' "$ROAPP_DOCS_INDEX" || true)"
          echo "http=$status" >> "$GITHUB_OUTPUT"
          case "$status" in 200|401|403|404|429|500|502|503) exit 0 ;; *) exit 1 ;; esac
      - name: Run V20.22 inventory
        if: steps.docs.outputs.http == '200'
        run: python scripts/marsel_api_inventory_v20_22.py
      - name: Validate V20.22 safety
        if: steps.docs.outputs.http == '200'
        run: |
          set -euo pipefail
          test -s marsel-api-inventory-v20-22.json
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-22.json',encoding='utf-8'))
          assert d['version']=='20.22'
          assert d['readonly'] is True
          assert d['write_requests_made']==0 and d['ro_app_data_mutated'] is False
          assert d['method_policy']['allowed']==['GET']
          assert d['summary']['documented_operations'] > 1
          assert d['completeness']['never_guess_identifiers'] is True
          print('SAFETY_VALIDATION=PASS')
          print('DOCUMENTED_OPERATIONS=',d['summary']['documented_operations'])
          print('OPERATIONS_WITH_EXTRACTED_PATHS=',d['summary']['operations_with_extracted_paths'])
          print('COMPLETENESS=',d['completeness']['status'])
          print('OPENAPI_OPERATIONS=',d['openapi']['operations_extracted'])
          PY
      - name: Upload V20.22 inventory
        if: steps.docs.outputs.http == '200'
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-22-api-inventory
          path: marsel-api-inventory-v20-22.json
          if-no-files-found: error
