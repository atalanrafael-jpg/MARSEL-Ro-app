name: "AI: generate drafts (scheduled)"
on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generate drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AI_TOPIC: "Daily post ideas for Ro-app"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; scheduled AI draft generation is skipped safely."
            exit 0
          fi
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT is not configured; scheduled AI draft generation is skipped safely."
            exit 0
          fi
          python scripts/generate_drafts.py
