name: MARSEL V20.4 audit

on:
  push:
    branches: ["v20.3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: MARSEL V20.4 read-only audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v20_4.py --readonly
      - name: Upload MARSEL audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-4-audit
          if-no-files-found: error
          path: |
            marsel-reference-verification-v20-4.json
            marsel-access-reference-matrix-v20-4.json
