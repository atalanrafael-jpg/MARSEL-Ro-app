name: MARSEL V19 — Referential Integrity Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v19.py'
      - '.github/workflows/marsel-v19.yml'

permissions:
  contents: read

jobs:
  audit:
    name: V19 read-only structural inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Compile V19
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/marsel_audit_v19.py
          echo "PY_COMPILE=OK"

      - name: Run MARSEL V19 read-only inventory
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
          ROAPP_MAX_PAGES: '10'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v19.py --readonly

      - name: Upload V19 report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marsel-integrity-audit-v19
          path: marsel-integrity-audit-v19.json
          if-no-files-found: error
