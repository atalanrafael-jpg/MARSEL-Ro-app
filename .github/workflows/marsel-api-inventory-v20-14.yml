name: MARSEL V20.19 Official API Inventory — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_api_inventory_v20_14.py'
      - '.github/workflows/marsel-api-inventory-v20-14.yml'

permissions:
  contents: read

concurrency:
  group: marsel-api-inventory-v20-19
  cancel-in-progress: true

jobs:
  inventory:
    name: Official API inventory — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
      ROAPP_TIMEOUT: '30'
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-19.json
      MARSEL_MAX_DOCS: '300'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python --version

      - name: Check official documentation availability
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o /tmp/roapp-llms.txt -w '%{http_code}' --max-time 30 -A 'MARSEL-Audit-V20.19' "$ROAPP_DOCS_INDEX" || true)"
          echo "http=$status" >> "$GITHUB_OUTPUT"
          echo "ROAPP_DOCS_INDEX_HTTP=$status"
          case "$status" in
            200|401|403|404|429|500|502|503) exit 0 ;;
            *) echo "Unexpected documentation HTTP status: $status" >&2; exit 1 ;;
          esac

      - name: Run MARSEL V20.19 official API inventory
        if: steps.docs.outputs.http == '200'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marsel_api_inventory_v20_14.py

      - name: Create degraded read-only report when documentation is unavailable
        if: steps.docs.outputs.http != '200'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, hashlib
          status = int(os.environ.get('DOCS_HTTP', '0'))
          report = {
              'version': '20.19', 'readonly': True, 'degraded': True,
              'degraded_reason': 'Official RO App documentation index was not accessible; no undocumented endpoints were assumed.',
              'write_requests_made': 0, 'ro_app_data_mutated': False,
              'method_policy': {'allowed': ['GET'], 'forbidden': ['POST', 'PUT', 'PATCH', 'DELETE']},
              'documentation': {'index': os.environ['ROAPP_DOCS_INDEX'], 'index_http': status, 'reference_links': 0, 'parse_errors': 0},
              'operations': [],
              'summary': {
                  'reference_links': 0, 'documented_operations': 0, 'documented_get_operations': 0,
                  'documented_non_get_operations': 0, 'operations_with_extracted_paths': 0,
                  'get_operations_probed': 0, 'get_operations_not_probed': 0,
                  'get_operations_with_unresolved_probe_state': 0, 'get_probe_http_counts': {},
                  'write_requests_made': 0, 'ro_app_data_mutated': False,
              },
          }
          raw = json.dumps(report['operations'], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          report['summary']['inventory_sha256'] = hashlib.sha256(raw).hexdigest()
          with open(os.environ['MARSEL_API_INVENTORY_OUTPUT'], 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print('DEGRADED_READ_ONLY_REPORT=TRUE')
          print(f'DOCS_INDEX_HTTP={status}')
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=FALSE')
          PY
        env:
          DOCS_HTTP: ${{ steps.docs.outputs.http }}

      - name: Validate V20.19 report
        shell: bash
        run: |
          set -euo pipefail
          test -s marsel-api-inventory-v20-19.json
          python - <<'PY'
          import json
          p='marsel-api-inventory-v20-19.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d['version'] == '20.19'
          assert d['readonly'] is True
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['method_policy']['allowed'] == ['GET']
          http = d['documentation']['index_http']
          print('VALIDATION_INPUTS:')
          print('  DOCS_INDEX_HTTP=', http)
          print('  DOCUMENTED_OPERATIONS=', d['summary']['documented_operations'])
          print('  OPERATIONS_WITH_EXTRACTED_PATHS=', d['summary']['operations_with_extracted_paths'])
          print('  GET_OPERATIONS_PROBED=', d['summary']['get_operations_probed'])
          print('  GET_OPERATIONS_NOT_PROBED=', d['summary']['get_operations_not_probed'])
          print('  GET_OPERATIONS_WITH_UNRESOLVED_PROBE_STATE=', d['summary']['get_operations_with_unresolved_probe_state'])
          assert http == 200 or d.get('degraded') is True
          if http == 200:
              assert d['summary']['documented_operations'] > 1, 'Expected >1 documented operation from official reference index'
              assert d['summary']['operations_with_extracted_paths'] > 1, 'API path extraction regression: fewer than 2 documented paths found'
          else:
              assert d['summary']['documented_operations'] == 0
              assert d.get('degraded_reason')
          print('VALIDATION=PASS')
          print('DEGRADED=', d.get('degraded', False))
          print('DOCS_INDEX_HTTP=', http)
          print('DOCUMENTED_OPERATIONS=', d['summary']['documented_operations'])
          print('OPERATIONS_WITH_EXTRACTED_PATHS=', d['summary']['operations_with_extracted_paths'])
          print('GET_OPERATIONS_PROBED=', d['summary']['get_operations_probed'])
          print('INVENTORY_SHA256=', d['summary']['inventory_sha256'])
          PY

      - name: Upload V20.19 inventory
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-19-api-inventory
          path: marsel-api-inventory-v20-19.json
          if-no-files-found: error
          compression-level: 6
