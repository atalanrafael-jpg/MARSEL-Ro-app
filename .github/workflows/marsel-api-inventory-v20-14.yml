name: MARSEL V20.14 Official API Inventory — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_api_inventory_v20_14.py'
      - '.github/workflows/marsel-api-inventory-v20-14.yml'

permissions:
  contents: read

concurrency:
  group: marsel-api-inventory-v20-14
  cancel-in-progress: true

jobs:
  inventory:
    name: Official API inventory — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
      ROAPP_TIMEOUT: '30'
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-14.json
      MARSEL_MAX_DOCS: '300'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python --version

      - name: Run MARSEL V20.14 official API inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marsel_api_inventory_v20_14.py

      - name: Validate V20.14 report
        shell: bash
        run: |
          set -euo pipefail
          test -s marsel-api-inventory-v20-14.json
          python - <<'PY'
          import json
          p='marsel-api-inventory-v20-14.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d['version'] == '20.14'
          assert d['readonly'] is True
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['method_policy']['allowed'] == ['GET']
          assert d['documentation']['index_http'] == 200
          assert d['summary']['documented_operations'] > 1
          print('VALIDATION=PASS')
          print('REFERENCE_LINKS=', d['summary']['reference_links'])
          print('DOCUMENTED_OPERATIONS=', d['summary']['documented_operations'])
          print('DOCUMENTED_GET_OPERATIONS=', d['summary']['documented_get_operations'])
          print('GET_OPERATIONS_PROBED=', d['summary']['get_operations_probed'])
          print('INVENTORY_SHA256=', d['summary']['inventory_sha256'])
          PY

      - name: Upload V20.14 inventory
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-14-api-inventory
          path: marsel-api-inventory-v20-14.json
          if-no-files-found: error
          compression-level: 6
