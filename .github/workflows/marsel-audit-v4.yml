name: "MARSEL audit v4.2"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: "MARSEL AUDIT V4.2 — RO App API read-only diagnostics"
    runs-on: ubuntu-latest
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      MARSEL_AUDIT_REPORT: marsel-audit-v4-report.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check httpx

      - name: Run MARSEL API audit (read-only)
        run: |
          set -euo pipefail
          python scripts/marsel_audit_v4.py --readonly

      - name: Validate and print diagnostic summary
        run: |
          set -euo pipefail
          test -s marsel-audit-v4-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("marsel-audit-v4-report.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("readonly") is True
          assert data.get("write_methods_used") == 0
          assert data.get("delete_methods_used") == 0
          details = data.get("details", {})
          required = {
              "missing_assignee",
              "active_past_due",
              "active_past_due_overdue_true",
              "active_past_due_overdue_false",
              "closed_past_due",
              "missing_due_date",
              "status_overdue_inconsistencies",
          }
          assert required.issubset(details)
          print("AUDIT_REPORT_VALID=True")
          print(f"MISSING_ASSIGNEE_DETAILS={len(details['missing_assignee'])}")
          for row in details["missing_assignee"]:
              print(
                  "MISSING_ASSIGNEE_ORDER="
                  f"id:{row.get('id')};number:{row.get('number')};"
                  f"status:{row.get('status_name')};type:{row.get('order_type_name')};"
                  f"manager_id:{row.get('manager_id')};due_date:{row.get('due_date')}"
              )
          print(f"ACTIVE_PAST_DUE_DETAILS={len(details['active_past_due'])}")
          print(f"ACTIVE_PAST_DUE_OVERDUE_TRUE={len(details['active_past_due_overdue_true'])}")
          print(f"ACTIVE_PAST_DUE_OVERDUE_FALSE={len(details['active_past_due_overdue_false'])}")
          print(f"CLOSED_PAST_DUE_DETAILS={len(details['closed_past_due'])}")
          print(f"MISSING_DUE_DATE_DETAILS={len(details['missing_due_date'])}")
          print(f"STATUS_OVERDUE_INCONSISTENCY_DETAILS={len(details['status_overdue_inconsistencies'])}")
          print("WRITE_METHODS_USED=0")
          print("DELETE_METHODS_USED=0")
          PY

      - name: Upload expanded audit report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-audit-v4.2-report
          path: marsel-audit-v4-report.json
          if-no-files-found: error
          retention-days: 14
