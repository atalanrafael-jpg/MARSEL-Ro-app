name: "MARSEL audit v4"

on:
  workflow_dispatch:

jobs:
  audit:
    name: "MARSEL AUDIT V4 — RO App API read-only diagnostics"
    runs-on: ubuntu-latest
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check httpx

      - name: Run MARSEL API audit (read-only)
        run: |
          set -euo pipefail
          python scripts/marsel_audit_v4.py --readonly

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-audit-v4-report
          path: marsel-audit-v4-report.json
          if-no-files-found: error
