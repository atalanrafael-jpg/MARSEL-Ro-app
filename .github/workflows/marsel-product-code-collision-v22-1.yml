name: MARSEL V22.1 Product Code Collision Audit — READ ONLY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: "30"
      ROAPP_MIN_REQUEST_INTERVAL: "0.34"
      MARSEL_PAGE_SIZE: "50"
      MARSEL_COLLISION_OUTPUT: marsel-product-code-collisions-v22-1-readonly.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify secret
        shell: bash
        run: test -n "$ROAPP_API_KEY"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check httpx
      - name: Run collision audit — READ ONLY
        run: python scripts/marsel_product_code_collision_audit_v22_1.py
      - name: Enforce read-only invariant
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-product-code-collisions-v22-1-readonly.json',encoding='utf-8'))
          assert d['mode']=='READ_ONLY'
          assert d['write_requests_made']==0
          assert d['ro_app_data_mutated'] is False
          assert d['pagination_complete'] is True
          print('SAFETY_GATE=PASS')
          print('DUPLICATE_CODE_GROUP_COUNT=', d['duplicate_code_group_count'])
          PY
      - name: Write SHA-256 sidecar
        run: sha256sum marsel-product-code-collisions-v22-1-readonly.json | tee marsel-product-code-collisions-v22-1-readonly.sha256
      - name: Upload audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v22-1-product-code-collision-readonly
          path: |
            marsel-product-code-collisions-v22-1-readonly.json
            marsel-product-code-collisions-v22-1-readonly.sha256
          if-no-files-found: error
