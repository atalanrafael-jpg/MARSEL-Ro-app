name: MARSEL Canonical RO APP Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

concurrency:
  group: marsel-canonical-audit
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  readonly-integrity:
    name: Canonical READ-ONLY integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require API key
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: test -n "$ROAPP_API_KEY"
      - name: Run canonical V2 probe
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2/
        run: python scripts/marsel_api_v2_probe_v1.py
      - name: Run existing READ-ONLY integrity audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
        run: python scripts/marsel_readonly_integrity_v21.py
      - name: Run existing data-quality audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
        run: python scripts/marsel_data_quality_v22_readonly.py

  safety-gate:
    name: Safety gate
    needs: readonly-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Confirm canonical gate
        run: |
          set -euo pipefail
          echo 'CANONICAL_PIPELINE=PASS'
          echo 'WRITE_OPERATIONS=0'
          echo 'PRODUCTION_MUTATION=FALSE'
