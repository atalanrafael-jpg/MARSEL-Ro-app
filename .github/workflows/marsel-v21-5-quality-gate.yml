name: MARSEL V21.5 Quality Gate

on:
  push:
    paths:
      - 'docs/MARSEL_V21_5_MASTER_REFERENCE_DIRECTORIES.md'
      - 'scripts/marsel_v21_5_quality_gate.py'
      - '.github/workflows/marsel-v21-5-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V21.5 Quality Gate
        run: python scripts/marsel_v21_5_quality_gate.py
