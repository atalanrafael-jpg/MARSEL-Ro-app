name: MARSEL V20.12 full inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_inventory_v20_12.py'
      - '.github/workflows/marsel-inventory-v20-12.yml'

permissions:
  contents: read

jobs:
  inventory:
    name: Full inventory — READ ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      MARSEL_INVENTORY_OUTPUT: marsel-full-inventory-v20-12.json
      MARSEL_PAGE_SIZE: '100'
      MARSEL_MAX_PAGES: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run MARSEL V20.12 full inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_inventory_v20_12.py

      - name: Validate inventory artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s marsel-full-inventory-v20-12.json
          python - <<'PY'
          import json
          p='marsel-full-inventory-v20-12.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d['version'] == '20.12'
          assert d['readonly'] is True
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['method_policy']['allowed'] == ['GET']
          assert not any(x.get('http') not in (200, None) for t in d['targets'] for x in t['pages'])
          print('VALIDATION=PASS')
          print('RECORDS=', d['summary']['records'])
          print('INVENTORY_SHA256=', d['summary']['inventory_sha256'])
          PY

      - name: Upload V20.12 inventory
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-12-full-inventory
          if-no-files-found: error
          path: marsel-full-inventory-v20-12.json
          compression-level: 6
