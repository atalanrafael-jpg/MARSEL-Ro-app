name: MARSEL Audit V20.10 — Targeted API Diagnostics Read Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v20_10.py'
      - '.github/workflows/marsel-audit-v20-10.yml'

permissions:
  contents: read

jobs:
  audit:
    name: MARSEL V20.10 Targeted API Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: 30
      MARSEL_AUDIT_OUTPUT: marsel-api-diagnostics-v20-10.json
      MARSEL_PAGE_SIZE: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate API secret
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"

      - name: Run V20.10 targeted diagnostics
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -f scripts/marsel_audit_v20_10.py
          python scripts/marsel_audit_v20_10.py --readonly

      - name: Verify report safety invariants
        run: |
          set -euo pipefail
          test -s "$MARSEL_AUDIT_OUTPUT"
          python - <<'PY'
          import json, os
          with open(os.environ['MARSEL_AUDIT_OUTPUT'], encoding='utf-8') as f:
              data=json.load(f)
          if data.get('readonly') is not True:
              raise SystemExit('FAIL: readonly is not true')
          if data.get('write_requests_made', 0) != 0:
              raise SystemExit('FAIL: write_requests_made is not zero')
          if data.get('ro_app_data_mutated') is not False:
              raise SystemExit('FAIL: mutation flag is not false')
          if data.get('method_policy', {}).get('allowed') != ['GET']:
              raise SystemExit('FAIL: allowed method policy is not GET-only')
          print('REPORT_OK=1')
          print('READONLY=', data.get('readonly'))
          print('WRITE_REQUESTS_MADE=', data.get('write_requests_made'))
          print('RO_APP_DATA_MUTATED=', data.get('ro_app_data_mutated'))
          print('ALLOWED_METHODS=', data.get('method_policy', {}).get('allowed'))
          PY

      - name: Upload V20.10 report
        uses: actions/upload-artifact@v6
        with:
          name: marsel-v20-10-api-diagnostics
          path: marsel-api-diagnostics-v20-10.json
          if-no-files-found: error
          retention-days: 30
