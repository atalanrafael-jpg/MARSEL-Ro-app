name: MARSEL V17.2.3 — Live GET Response Metadata Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/marsel_audit_v17_2_3.py'
      - '.github/workflows/marsel-v17-2.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit
        run: python -m py_compile scripts/marsel_audit_v17_2_3.py
      - name: Run read-only metadata audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v17_2_3.py --readonly
      - name: Upload metadata report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-live-api-metadata-v17-2-3
          path: marsel-live-api-metadata-v17-2-3.json
          if-no-files-found: error
