name: MARSEL Language Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  language-quality:
    name: Russian spelling and punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Russian spelling and basic punctuation
        id: quality-check
        shell: bash
        run: |
          set +e
          python scripts/marsel_language_quality_check.py | tee marsel-language-quality.txt
          status=${PIPESTATUS[0]}
          echo "quality_exit_code=$status" >> marsel-language-quality.txt
          exit "$status"
      - name: Upload language quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsel-language-quality-report
          path: marsel-language-quality.txt
          if-no-files-found: error
          retention-days: 14
