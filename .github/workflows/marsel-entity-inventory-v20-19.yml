name: MARSEL V20.19 Entity Inventory (READ ONLY)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MARSEL V20.14 API Inventory (READ ONLY)"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_TIMEOUT: 30
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-14.json
      MARSEL_ENTITY_INVENTORY_OUTPUT: marsel-entity-inventory-v20-19.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt
          python -m pip install --disable-pip-version-check --no-input 'httpx>=0.28,<1'

      - name: Download V20.14 inventory artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, zipfile, io
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ.get('GITHUB_EVENT_WORKFLOW_RUN_ID')
          if not run_id:
              print('MANUAL_DISPATCH=true; artifact must be present in workspace or copied from a successful V20.14 run')
              raise SystemExit(0)
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts',
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          matches = [a for a in data.get('artifacts', []) if a.get('name') == 'marsel-v20-14-api-inventory' and not a.get('expired')]
          if not matches:
              raise SystemExit('V20.14 inventory artifact not found on triggering run')
          artifact_url = matches[0]['archive_download_url']
          req = urllib.request.Request(artifact_url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}"})
          with urllib.request.urlopen(req, timeout=60) as r:
              blob = r.read()
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              names = z.namelist()
              target = 'marsel-api-inventory-v20-14.json'
              if target not in names:
                  raise SystemExit(f'{target} missing from artifact: {names}')
              with z.open(target) as src, open(target, 'wb') as dst:
                  dst.write(src.read())
          print(f'INVENTORY_DOWNLOADED={target}')
          PY

      - name: Verify configuration
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          test -s "$MARSEL_API_INVENTORY_INPUT"
          python - <<'PY'
          import json, os
          p=os.environ['MARSEL_API_INVENTORY_INPUT']
          d=json.load(open(p, encoding='utf-8'))
          assert isinstance(d, dict)
          print('INVENTORY_VERSION=', d.get('version'))
          print('INVENTORY_READ_ONLY=', d.get('mode', d.get('readonly')))
          PY

      - name: Run V20.19 strict read-only entity inventory
        run: python scripts/marsel_entity_inventory_v20_19.py

      - name: Validate report safety
        run: |
          python - <<'PY'
          import json, os
          p=os.environ['MARSEL_ENTITY_INVENTORY_OUTPUT']
          d=json.load(open(p, encoding='utf-8'))
          assert d['mode'] == 'READ_ONLY'
          assert d['write_requests'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['safe_methods_used'] == ['GET']
          assert d['write_methods_used'] == []
          print('SAFETY_VALIDATION=PASS')
          PY

      - name: Upload V20.19 report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-19-entity-inventory
          path: marsel-entity-inventory-v20-19.json
          if-no-files-found: error
          retention-days: 30
