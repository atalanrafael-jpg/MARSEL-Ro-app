name: MARSEL V20.19 Entity Inventory (READ ONLY)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_entity_inventory_v20_19.py'
      - '.github/workflows/marsel-entity-inventory-v20-19.yml'
      - 'scripts/marsel_api_inventory_v20_29.py'
      - 'scripts/marsel_api_inventory_v20_31.py'
      - 'scripts/marsel_live_probe_v20_27.py'
  workflow_run:
    workflows: ["MARSEL V20.29 API Inventory + Live Read-Only Probe"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_TIMEOUT: 12
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-29.json
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-29.json
      MARSEL_ENTITY_INVENTORY_OUTPUT: marsel-entity-inventory-v20-19.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'httpx>=0.28,<1'
      - name: Generate current API inventory
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEXES: https://roapp.readme.io/llms.txt,https://roappua.readme.io/llms.txt
          MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-29.json
          ROAPP_MIN_REQUEST_INTERVAL: '0.34'
          MARSEL_INVENTORY_BUDGET_SECONDS: '240'
        run: python scripts/marsel_api_inventory_v20_31.py
      - name: Validate inventory safety and report fields
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-29.json',encoding='utf-8'))
          assert d.get('readonly') is True, 'readonly flag is not true'
          assert d.get('write_requests_made') == 0, f"write_requests_made={d.get('write_requests_made')}"
          assert d.get('ro_app_data_mutated') is False, f"ro_app_data_mutated={d.get('ro_app_data_mutated')}"
          assert d.get('safety',{}).get('write_methods_used') == [], f"write_methods_used={d.get('safety',{}).get('write_methods_used')}"
          assert d.get('contract_state',{}).get('parameterized_identifiers_guessed') is False, 'parameterized identifiers were guessed'

          summary=d.get('summary') or {}
          discovery=d.get('openapi_discovery') or {}
          operations=d.get('operations') or []
          print('INVENTORY_SAFETY=PASS')
          print('CONFIRMED_OPERATIONS=',len(operations))
          print('GET_PROBES_ATTEMPTED=',d.get('GET_PROBES_ATTEMPTED', summary.get('get_probes_attempted')))
          print('GET_OPERATIONS=',summary.get('get_operations'))
          print('OPENAPI_CANDIDATES=',discovery.get('candidate_urls'))
          print('OPENAPI_DOCUMENTS_WITH_OPERATIONS=',discovery.get('documents_with_operations'))
          print('PARAMETERIZED_NOT_PROBED=',summary.get('parameterized_not_probed'))
          print('REPORT_SHA256=',d.get('report_sha256'))
          PY
      - name: Run V20.34 strict read-only entity inventory
        run: python scripts/marsel_entity_inventory_v20_19.py
      - name: Validate report safety
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-entity-inventory-v20-19.json',encoding='utf-8'))
          assert d['mode']=='READ_ONLY'
          assert d['write_requests']==0
          assert d['ro_app_data_mutated'] is False
          assert d['write_methods_used']==[]
          print('SAFETY_VALIDATION=PASS')
          print('CLASSIFICATIONS=',d['classifications'])
          PY
      - name: Upload V20.19 report
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-19-entity-inventory
          path: |
            marsel-api-inventory-v20-29.json
            marsel-entity-inventory-v20-19.json
          if-no-files-found: error
          retention-days: 30
