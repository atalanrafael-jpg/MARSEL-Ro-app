name: MARSEL V20.19 Entity Inventory (READ ONLY)

# V20.36 CI refresh: force execution from the corrected workflow definition.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/marsel_entity_inventory_v20_19.py'
      - '.github/workflows/marsel-entity-inventory-v20-19.yml'
      - 'scripts/marsel_api_inventory_v20_31.py'
      - 'scripts/marsel_live_probe_v20_27.py'
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_entity_inventory_v20_19.py'
      - '.github/workflows/marsel-entity-inventory-v20-19.yml'
      - 'scripts/marsel_api_inventory_v20_31.py'
      - 'scripts/marsel_live_probe_v20_27.py'
  workflow_run:
    workflows: ["MARSEL V20.29 API Inventory + Live Read-Only Probe"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_TIMEOUT: 12
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-29.json
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-29.json
      MARSEL_ENTITY_INVENTORY_OUTPUT: marsel-entity-inventory-v20-19.json
      MARSEL_MAX_IDS_PER_COLLECTION: 3
      MARSEL_MAX_DETAIL_PROBES: 50
      MARSEL_MAX_PAGES_PER_COLLECTION: 50
      MARSEL_MAX_RECORDS_PER_COLLECTION: 5000
      MARSEL_PAGE_LIMIT: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'httpx>=0.28,<1'
      - name: Generate current API inventory
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEXES: https://roapp.readme.io/llms.txt,https://roappua.readme.io/llms.txt
          MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-29.json
          ROAPP_MIN_REQUEST_INTERVAL: '0.34'
          MARSEL_INVENTORY_BUDGET_SECONDS: '240'
        run: python scripts/marsel_api_inventory_v20_31.py
      - name: Validate API inventory safety
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-29.json',encoding='utf-8'))
          assert d.get('readonly') is True
          assert d.get('write_requests_made',0)==0
          assert d.get('ro_app_data_mutated') is False
          assert ((d.get('safety') or {}).get('write_methods_used') or []) == []
          assert d.get('contract_state',{}).get('parameterized_identifiers_guessed') is False
          print('INVENTORY_SAFETY=PASS')
          print('CONFIRMED_OPERATIONS=',len(d.get('operations') or []))
          print('GET_PROBES=',(d.get('summary') or {}).get('get_probes_attempted'))
          print('PARAMETERIZED_NOT_PROBED=',(d.get('summary') or {}).get('parameterized_not_probed'))
          print('REPORT_SHA256=',d.get('report_sha256'))
          PY
      - name: Run V20.36 bounded paginated read-only entity + detail inventory
        run: python scripts/marsel_entity_inventory_v20_19.py
      - name: Validate V20.36 safety and audit invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-entity-inventory-v20-19.json',encoding='utf-8'))
          assert d['version']=='20.36'
          assert d['mode']=='READ_ONLY'
          assert d['write_requests']==0
          assert d['ro_app_data_mutated'] is False
          assert d['write_methods_used']==[]
          assert d['parameterized_identifiers_guessed'] is False
          assert d['audit_status']=='PASS'
          print('SAFETY_VALIDATION=PASS')
          print('COLLECTION_PATHS_CONSIDERED=',d['collection_paths_considered'])
          print('COLLECTION_PAGES_FETCHED=',sum(x['pages_fetched'] for x in d['collection_stats'].values()))
          print('COLLECTION_RECORDS_FETCHED=',sum(x['records_fetched'] for x in d['collection_stats'].values()))
          print('REAL_IDENTIFIERS_EXTRACTED=',d['real_identifiers_extracted'])
          print('DETAIL_PROBES=',len(d['detail_results']))
          print('DUPLICATE_CANDIDATE_GROUPS=',d['duplicate_candidate_groups'])
          print('CLASSIFICATIONS=',d['classifications'])
          print('DETAIL_CLASSIFICATIONS=',d['detail_classifications'])
          PY
      - name: Upload V20.36 report
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-36-entity-inventory
          path: |
            marsel-api-inventory-v20-29.json
            marsel-entity-inventory-v20-19.json
          if-no-files-found: error
          retention-days: 30
