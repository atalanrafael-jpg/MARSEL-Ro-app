name: MARSEL Audit V15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v15.py'
      - '.github/workflows/marsel-audit-v15.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input httpx
      - name: Run MARSEL Audit V15 (read-only)
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v15.py --readonly
      - name: Upload V15 report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-api-master-inventory-v15
          path: marsel-api-master-inventory-v15.json
          if-no-files-found: error
