name: MARSEL V20.23 API Discovery Inventory — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_api_inventory_v20_23.py'
      - '.github/workflows/marsel-api-inventory-v20-23.yml'

permissions:
  contents: read

concurrency:
  group: marsel-api-inventory-v20-23
  cancel-in-progress: true

jobs:
  inventory:
    name: API discovery inventory — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
      ROAPP_TIMEOUT: '30'
      ROAPP_MIN_REQUEST_INTERVAL: '0.34'
      ROAPP_MAX_RETRIES: '3'
      ROAPP_RETRY_BASE_SECONDS: '0.75'
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-23.json
      MARSEL_MAX_DOCS: '300'
      MARSEL_MAX_DISCOVERY_URLS: '100'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify configuration
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Check official documentation availability
        id: docs
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o /tmp/roapp-llms.txt -w '%{http_code}' --max-time 30 -A 'MARSEL-Audit-V20.23' "$ROAPP_DOCS_INDEX" || true)"
          echo "http=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "200"
      - name: Run V20.23 inventory
        run: python scripts/marsel_api_inventory_v20_23.py
      - name: Validate safety and evidence gates
        run: |
          set -euo pipefail
          test -s marsel-api-inventory-v20-23.json
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-23.json',encoding='utf-8'))
          assert d['version']=='20.23'
          assert d['readonly'] is True
          assert d['write_requests_made']==0
          assert d['ro_app_data_mutated'] is False
          assert d['method_policy']['allowed']==['GET']
          assert d['safety']['status']=='PASS'
          assert d['contract_state']['never_guess_identifiers'] is True
          assert d['summary']['unique_confirmed_operations'] >= 0
          print('SAFETY_GATE=PASS')
          print('COMPLETENESS_CLAIM=',d['contract_state']['completeness_claim'])
          print('UNIQUE_OPERATIONS=',d['summary']['unique_confirmed_operations'])
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=false')
          if d['summary']['unique_confirmed_operations'] == 0:
              print('DISCOVERY_STATUS=INCOMPLETE_NO_DOCUMENTED_OPERATIONS_FOUND')
          else:
              print('DISCOVERY_STATUS=OPERATIONS_FOUND')
          PY
      - name: Write SHA-256 sidecar
        run: |
          set -euo pipefail
          sha256sum marsel-api-inventory-v20-23.json | tee marsel-api-inventory-v20-23.sha256
      - name: Upload V20.23 inventory artifact
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-23-api-inventory
          path: |
            marsel-api-inventory-v20-23.json
            marsel-api-inventory-v20-23.sha256
          if-no-files-found: error
