name: Agent Runtime Tests
on:
  pull_request:
    paths: ["agent_runtime/**","tests/test_agent_runtime.py","tests/test_agent_extensions.py",".github/workflows/agent-runtime-tests.yml"]
  push:
    branches: [main]
    paths: ["agent_runtime/**","tests/test_agent_runtime.py","tests/test_agent_extensions.py"]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_agent_runtime.py tests/test_agent_extensions.py
