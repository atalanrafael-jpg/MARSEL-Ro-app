name: MARSEL V21 Read-Only Entity Integrity Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_readonly_integrity_v21.py'
      - 'scripts/marsel_api_inventory_v20_29.py'
      - 'scripts/marsel_live_probe_v20_27.py'
      - '.github/workflows/marsel-readonly-integrity-v21.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: marsel-readonly-integrity-v21
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify API configuration
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Build V20.30 official multi-index inventory
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEXES: https://roapp.readme.io/llms.txt,https://roappua.readme.io/llms.txt
          MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-30.json
          MARSEL_MAX_DOCS: '60'
          MARSEL_INVENTORY_BUDGET_SECONDS: '240'
          ROAPP_TIMEOUT: '10'
          ROAPP_MAX_RETRIES: '0'
          ROAPP_MIN_REQUEST_INTERVAL: '0.20'
        run: python scripts/marsel_api_inventory_v20_29.py
      - name: Enforce inventory zero-write contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-inventory-v20-30.json',encoding='utf-8'))
          assert d['readonly'] is True
          assert d['method_policy']['allowed'] == ['GET']
          assert d['write_requests_made'] == 0
          assert d['ro_app_data_mutated'] is False
          assert d['contract_state']['parameterized_identifiers_guessed'] is False
          print('INVENTORY_SAFETY=PASS')
          PY
      - name: Run V20 GET-only live probe and retain evidence on endpoint errors
        continue-on-error: true
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-30.json
          MARSEL_LIVE_PROBE_OUTPUT: marsel-live-probe-v20-30.json
          ROAPP_TIMEOUT: '10'
          ROAPP_MAX_RETRIES: '0'
          ROAPP_MIN_REQUEST_INTERVAL: '0.20'
        run: python scripts/marsel_live_probe_v20_27.py
      - name: Enforce live-probe safety contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-live-probe-v20-30.json',encoding='utf-8'))
          assert d['readonly'] is True
          assert d['method_policy']['allowed'] == ['GET']
          assert d['safety']['write_requests_made'] == 0
          assert d['safety']['ro_app_data_mutated'] is False
          assert d['contract_state']['parameterized_identifiers_guessed'] is False
          print('LIVE_PROBE_SAFETY=PASS')
          print('LIVE_PROBE_STATUS='+str(d.get('status')))
          print('HTTP_ERRORS='+str(d.get('metrics',{}).get('http_error_responses')))
          PY
      - name: Run V21 entity integrity audit
        env:
          MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-30.json
          MARSEL_LIVE_PROBE_INPUT: marsel-live-probe-v20-30.json
          MARSEL_INTEGRITY_OUTPUT: marsel-readonly-integrity-v21.json
        run: python scripts/marsel_readonly_integrity_v21.py
      - name: Write SHA-256 manifest
        run: |
          set -euo pipefail
          sha256sum marsel-api-inventory-v20-30.json marsel-live-probe-v20-30.json marsel-readonly-integrity-v21.json > marsel-v21-sha256.txt
          cat marsel-v21-sha256.txt
      - name: Upload non-public audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v21-readonly-integrity-evidence
          path: |
            marsel-api-inventory-v20-30.json
            marsel-live-probe-v20-30.json
            marsel-readonly-integrity-v21.json
            marsel-v21-sha256.txt
          if-no-files-found: error
          retention-days: 90
