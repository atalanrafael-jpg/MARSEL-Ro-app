name: MARSEL V17 — Live GET-Only Read-Only Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile V17
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/marsel_audit_v17.py
          echo "PY_COMPILE=OK"

      - name: Run V17 read-only live audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v17.py --readonly

      - name: Upload V17 report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marsel-live-api-readonly-v17
          path: marsel-live-api-readonly-v17.json
          if-no-files-found: error
