name: MARSEL V20.20 — Automated Gap Analyzer READ ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/marsel-gap-analyzer-v20-20.yml'
      - 'scripts/marsel_gap_analyzer_v20_20.py'
      - 'scripts/marsel_api_inventory_v20_14.py'

permissions:
  contents: read

jobs:
  gap-analyzer:
    name: MARSEL Gap Analyzer — READ ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
      ROAPP_TIMEOUT: '30'
      MARSEL_PAGE_SIZE: '100'
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-14.json
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-14.json
      MARSEL_GAP_REPORT_OUTPUT: marsel-gap-analysis-v20-20.json
      MARSEL_REPAIR_PLAN_OUTPUT: marsel-repair-plan-v20-20.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          echo 'ROAPP_API_KEY is configured.'

      - name: Build official API inventory — READ ONLY
        run: python scripts/marsel_api_inventory_v20_14.py

      - name: Run V20.20 gap analyzer — READ ONLY
        run: python scripts/marsel_gap_analyzer_v20_20.py

      - name: Verify safety invariants and report integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s marsel-api-inventory-v20-14.json
          test -s marsel-gap-analysis-v20-20.json
          test -s marsel-repair-plan-v20-20.json
          python - <<'PY'
          import hashlib, json
          report = json.load(open('marsel-gap-analysis-v20-20.json', encoding='utf-8'))
          plan = json.load(open('marsel-repair-plan-v20-20.json', encoding='utf-8'))
          assert report['mode'] == 'READ_ONLY'
          assert report['write_requests_made'] == 0
          assert report['ro_app_data_mutated'] is False
          assert report['summary']['pagination_complete'] is True
          assert plan['mode'] == 'DRY_RUN_ONLY'
          assert plan['execution_policy']['automatic_execution'] is False
          assert set(plan['execution_policy']['forbidden_methods_now']) == {'DELETE','PATCH','POST','PUT'}
          assert all(x['status'] == 'NOT_EXECUTED' for x in plan['requests'])
          print('SAFETY_INVARIANTS=PASS')
          print('WRITE_EXECUTION=DISABLED')
          PY

      - name: Upload V20.20 audit and repair-plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-20-gap-analysis-readonly
          path: |
            marsel-api-inventory-v20-14.json
            marsel-gap-analysis-v20-20.json
            marsel-repair-plan-v20-20.json
          if-no-files-found: error
          retention-days: 14
