name: MARSEL V20.27 Live Read-Only API Probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_live_probe_v20_27.py'
      - 'scripts/marsel_api_inventory_v20_23.py'
      - '.github/workflows/marsel-live-probe-v20-27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    name: Live GET-only API probe — READ ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify API configuration
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          echo 'API configuration present'

      - name: Generate V20.23 read-only inventory
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_MIN_REQUEST_INTERVAL: '0.34'
        run: python scripts/marsel_api_inventory_v20_23.py

      - name: Run V20.27 live GET-only probe
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-23.json
          MARSEL_LIVE_PROBE_OUTPUT: marsel-live-probe-v20-27.json
          ROAPP_MIN_REQUEST_INTERVAL: '0.34'
        run: python scripts/marsel_live_probe_v20_27.py

      - name: Enforce zero-write safety
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE '\b(POST|PUT|PATCH|DELETE)\b' scripts/marsel_live_probe_v20_27.py
          python - <<'PY'
          import json
          d=json.load(open('marsel-live-probe-v20-27.json',encoding='utf-8'))
          assert d['readonly'] is True
          assert d['safety']['write_requests_made'] == 0
          assert d['safety']['ro_app_data_mutated'] is False
          assert d['contract_state']['parameterized_identifiers_guessed'] is False
          print('ZERO_WRITE_SAFETY=PASS')
          PY

      - name: Write SHA-256 evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum marsel-api-inventory-v20-23.json marsel-live-probe-v20-27.json > marsel-v20-27-sha256.txt
          cat marsel-v20-27-sha256.txt

      - name: Upload V20.27 evidence
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-27-live-probe-evidence
          path: |
            marsel-api-inventory-v20-23.json
            marsel-live-probe-v20-27.json
            marsel-v20-27-sha256.txt
          if-no-files-found: error
          retention-days: 90
