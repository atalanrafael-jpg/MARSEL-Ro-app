name: MARSEL Audit V20.11 — Endpoint Resolution Read Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v20_11.py'
      - '.github/workflows/marsel-audit-v20-11.yml'

permissions:
  contents: read

jobs:
  audit:
    name: MARSEL V20.11 Endpoint Resolution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: 30
      MARSEL_AUDIT_OUTPUT: marsel-api-resolution-v20-11.json
      MARSEL_PAGE_SIZE: 100
      MARSEL_MAX_PAGES: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate API secret
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Run V20.11 read-only audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -f scripts/marsel_audit_v20_11.py
          python scripts/marsel_audit_v20_11.py --readonly
      - name: Verify read-only invariants
        run: |
          set -euo pipefail
          test -s "$MARSEL_AUDIT_OUTPUT"
          python - <<'PY'
          import json, os
          with open(os.environ['MARSEL_AUDIT_OUTPUT'], encoding='utf-8') as f: d=json.load(f)
          assert d.get('readonly') is True
          assert d.get('write_requests_made') == 0
          assert d.get('ro_app_data_mutated') is False
          assert d.get('method_policy',{}).get('allowed') == ['GET']
          print('REPORT_OK=1')
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=False')
          PY
      - name: Upload V20.11 report
        uses: actions/upload-artifact@v6
        with:
          name: marsel-v20-11-endpoint-resolution
          path: marsel-api-resolution-v20-11.json
          if-no-files-found: error
          retention-days: 30
