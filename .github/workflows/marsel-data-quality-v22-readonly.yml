name: MARSEL V22 Comprehensive Data Quality — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_data_quality_v22_readonly.py'
      - '.github/workflows/marsel-data-quality-v22-readonly.yml'

permissions:
  contents: read

concurrency:
  group: marsel-data-quality-v22-readonly
  cancel-in-progress: true

jobs:
  audit:
    name: Comprehensive data quality audit — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      ROAPP_MIN_REQUEST_INTERVAL: '0.34'
      MARSEL_PAGE_SIZE: '50'
      MARSEL_DATA_QUALITY_OUTPUT: marsel-data-quality-v22-readonly.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify configuration
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check httpx
      - name: Run comprehensive read-only audit
        run: python scripts/marsel_data_quality_v22_readonly.py
      - name: Enforce safety and completeness gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('marsel-data-quality-v22-readonly.json',encoding='utf-8'))
          assert d['mode']=='READ_ONLY'
          assert d['write_requests_made']==0
          assert d['ro_app_data_mutated'] is False
          assert d['method_policy']['allowed']==['GET']
          assert d['summary']['hard_issue_count']==0, d['hard_issues']
          for name in ('products','services','orders'):
              assert d['collections'][name]['pagination_complete'] is True, name
          print('SAFETY_GATE=PASS')
          print('DATA_QUALITY_GATE=PASS')
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=false')
          print('PRODUCTS_ROWS=',d['summary']['products_rows'])
          print('SERVICES_ROWS=',d['summary']['services_rows'])
          print('ORDERS_ROWS=',d['summary']['orders_rows'])
          PY
      - name: Write SHA-256 sidecar
        run: sha256sum marsel-data-quality-v22-readonly.json | tee marsel-data-quality-v22-readonly.sha256
      - name: Upload audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v22-comprehensive-data-quality-readonly
          path: |
            marsel-data-quality-v22-readonly.json
            marsel-data-quality-v22-readonly.sha256
          if-no-files-found: error
