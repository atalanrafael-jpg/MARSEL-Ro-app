name: MARSEL V20.25 API Coverage Integrity — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_coverage_audit_v20_25.py'
      - '.github/workflows/marsel-coverage-v20-25.yml'
      - 'scripts/marsel_api_inventory_v20_23.py'

permissions:
  contents: read

concurrency:
  group: marsel-coverage-v20-25
  cancel-in-progress: true

jobs:
  coverage:
    name: API coverage integrity gate — READ ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
      ROAPP_TIMEOUT: '30'
      ROAPP_MIN_REQUEST_INTERVAL: '0.34'
      ROAPP_MAX_RETRIES: '3'
      ROAPP_RETRY_BASE_SECONDS: '0.75'
      MARSEL_API_INVENTORY_OUTPUT: marsel-api-inventory-v20-23.json
      MARSEL_MAX_DOCS: '300'
      MARSEL_MAX_DISCOVERY_URLS: '100'
      MARSEL_API_INVENTORY_INPUT: marsel-api-inventory-v20-23.json
      MARSEL_COVERAGE_OUTPUT: marsel-api-coverage-v20-25.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify API configuration
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"

      - name: Generate V20.23 read-only inventory
        run: python scripts/marsel_api_inventory_v20_23.py

      - name: Run V20.25 coverage integrity audit
        run: python scripts/marsel_coverage_audit_v20_25.py

      - name: Enforce zero-write safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('marsel-api-coverage-v20-25.json',encoding='utf-8'))
          assert d['readonly'] is True
          assert d['status'] == 'PASS'
          assert d['interpretation']['writes_performed'] == 0
          assert d['interpretation']['ro_app_data_mutated'] is False
          assert d['interpretation']['completeness_claim'] == 'NOT_ESTABLISHED'
          print('V20.25_SAFETY_GATE=PASS')
          PY

      - name: Write SHA-256 sidecars
        run: |
          set -euo pipefail
          sha256sum marsel-api-inventory-v20-23.json | tee marsel-api-inventory-v20-23.sha256
          sha256sum marsel-api-coverage-v20-25.json | tee marsel-api-coverage-v20-25.sha256

      - name: Upload V20.25 evidence
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v20-25-coverage-evidence
          path: |
            marsel-api-inventory-v20-23.json
            marsel-api-inventory-v20-23.sha256
            marsel-api-coverage-v20-25.json
            marsel-api-coverage-v20-25.sha256
          if-no-files-found: error
