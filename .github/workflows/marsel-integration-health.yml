name: MARSEL Integration Health
on:
  push:
    branches: [main, 'automation/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  integration-health:
    runs-on: ubuntu-latest
    environment:
      name: staging
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Report endpoint configuration state
        env:
          ROAPP: ${{ vars.ROAPP_HEALTH_URL }}
          SUPABASE: ${{ vars.SUPABASE_HEALTH_URL }}
          VERCEL: ${{ vars.VERCEL_HEALTH_URL }}
          OPENAI: ${{ vars.OPENAI_HEALTH_URL }}
          WIX: ${{ vars.WIX_HEALTH_URL }}
        run: |
          for name in ROAPP SUPABASE VERCEL OPENAI WIX; do
            if [ -n "${!name}" ]; then
              echo "${name}_HEALTH_URL=CONFIGURED"
            else
              echo "${name}_HEALTH_URL=NOT_CONFIGURED"
            fi
          done
      - name: Run read-only integration health check
        env:
          MARSEL_INTEGRATION_HEALTH_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'production' }}
          MARSEL_ROAPP_HEALTH_URL: ${{ vars.ROAPP_HEALTH_URL }}
          MARSEL_SUPABASE_HEALTH_URL: ${{ vars.SUPABASE_HEALTH_URL }}
          MARSEL_VERCEL_HEALTH_URL: ${{ vars.VERCEL_HEALTH_URL }}
          MARSEL_OPENAI_HEALTH_URL: ${{ vars.OPENAI_HEALTH_URL }}
          MARSEL_WIX_HEALTH_URL: ${{ vars.WIX_HEALTH_URL }}
        run: python scripts/marsel_integration_health_v1.py
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marsel-integration-health
          path: artifacts/marsel-integration-health.json
          if-no-files-found: error
