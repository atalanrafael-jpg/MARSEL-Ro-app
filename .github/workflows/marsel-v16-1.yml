name: MARSEL V16.1 — Documentation Fallback Read-Only Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-v16-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify Python and script syntax
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m py_compile scripts/marsel_audit_v16_1.py
          echo "PY_COMPILE=OK"
          sha256sum scripts/marsel_audit_v16_1.py

      - name: Run MARSEL V16.1 read-only documentation inventory
        shell: bash
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v16_1.py --readonly

      - name: Validate audit report
        shell: bash
        run: |
          set -euo pipefail
          test -s marsel-api-master-inventory-v16-1.json
          python - <<'PY'
          import json
          p = 'marsel-api-master-inventory-v16-1.json'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          assert d['readonly'] is True
          assert d['safety']['api_requests_made'] is False
          assert d['safety']['write_requests_made'] is False
          assert d['safety']['updates_performed'] is False
          assert d['safety']['deletes_performed'] is False
          print('REPORT_VALIDATION=PASS')
          print('DOCS_HTTP=', d['official_docs']['http_status'])
          print('DEGRADED=', d['degraded'])
          print('REFERENCE_COUNT=', d['official_docs']['reference_count'])
          print('OPERATION_CANDIDATES=', d['inventory']['operation_candidates'])
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marsel-audit-v16-1-report
          path: marsel-api-master-inventory-v16-1.json
          if-no-files-found: error
          compression-level: 6
