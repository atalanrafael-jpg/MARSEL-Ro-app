name: MARSEL V21.1 Catalog Quality Gate

on:
  push:
    paths:
      - 'docs/MARSEL_MASTER_CATALOG_V21.md'
      - 'scripts/marsel_catalog_v21_1_validate.py'
      - '.github/workflows/marsel-catalog-v21-1.yml'
  pull_request:
    paths:
      - 'docs/MARSEL_MASTER_CATALOG_V21.md'
      - 'scripts/marsel_catalog_v21_1_validate.py'
      - '.github/workflows/marsel-catalog-v21-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate catalog
        run: python scripts/marsel_catalog_v21_1_validate.py
