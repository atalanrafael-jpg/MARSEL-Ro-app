name: MARSEL — full read-only backup controller

on:
  workflow_dispatch:
  schedule:
    - cron: '45 2 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marsel-full-readonly-backup-v1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      MARSEL_MAX_DOCS: '200'
      MARSEL_INVENTORY_BUDGET_SECONDS: '300'
      ROAPP_MIN_REQUEST_INTERVAL: '0.34'
      ROAPP_PAGE_SIZE: '50'
      MARSEL_MAX_PAGES_PER_ENDPOINT: '10000'
      MARSEL_INVENTORY_OUTPUT: marsel-api-inventory-v20-31.json
      MARSEL_INVENTORY_INPUT: marsel-api-inventory-v20-31.json
      MARSEL_FULL_BACKUP_OUTPUT: marsel-full-readonly-backup-v1.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx
      - name: Validate secret
        run: test -n "$ROAPP_API_KEY"
      - name: Discover official RO App API index/OpenAPI
        run: python scripts/marsel_official_roapp_discovery_v1.py
      - name: Build canonical V20.31 inventory
        run: python scripts/marsel_api_inventory_v20_31.py
      - name: Run fail-closed full read-only backup
        run: python scripts/marsel_full_readonly_backup_v1.py
      - name: Verify zero-write invariant
        run: |
          python - <<'PY'
          import json
          p=json.load(open('marsel-full-readonly-backup-v1.json',encoding='utf-8'))
          assert p['readonly'] is True
          assert p['write_requests_made'] == 0
          assert p['ro_app_data_mutated'] is False
          assert p['complete'] is True
          assert p['failed_endpoints'] == 0
          print('FULL_BACKUP_READ_ONLY_INVARIANTS=PASS')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: marsel-full-readonly-backup-v1-evidence
          path: |
            marsel-api-inventory-v20-31.json
            marsel-official-roapp-discovery-v1.json
            marsel-full-readonly-backup-v1.json
          if-no-files-found: error
          retention-days: 90
