name: MARSEL Evidence Classification

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read

jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify evidence boundaries
        run: python scripts/marsel_evidence_classification_check_v1.py
