name: MARSEL V16.1.1 — Documentation Fallback Read-Only Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-v16-1-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/marsel_audit_v16_1_1.py
          echo "PY_COMPILE=OK"

      - name: Run MARSEL V16.1.1 read-only audit
        shell: bash
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          ROAPP_DOCS_INDEX: https://roapp.readme.io/llms.txt
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_audit_v16_1_1.py --readonly

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marsel-audit-v16-1-1-report
          path: marsel-api-master-inventory-v16-1-1.json
          if-no-files-found: ignore
