name: MARSEL Audit V20.8 — Full Detail Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: MARSEL V20.8 Full Detail Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: 30
      MARSEL_AUDIT_OUTPUT: marsel-data-discovery-v20-8.json
      MARSEL_PAGE_SIZE: 100
      MARSEL_MAX_PAGES: 100
      MARSEL_MAX_DETAIL: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate API secret
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"

      - name: Run V20.8 read-only audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: |
          set -euo pipefail
          test -f scripts/marsel_audit_v20_8.py
          python scripts/marsel_audit_v20_8.py --readonly

      - name: Verify report exists
        run: |
          set -euo pipefail
          test -s "$MARSEL_AUDIT_OUTPUT"
          python - <<'PY'
          import json, os
          path = os.environ['MARSEL_AUDIT_OUTPUT']
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          if data.get('readonly') is not True:
              raise SystemExit('FAIL: audit report is not readonly=true')
          if data.get('write_requests_made', 0) != 0:
              raise SystemExit('FAIL: write_requests_made is not zero')
          print('REPORT_OK=1')
          print('READONLY=', data.get('readonly'))
          print('WRITE_REQUESTS_MADE=', data.get('write_requests_made'))
          PY

      - name: Upload V20.8 report
        uses: actions/upload-artifact@v6
        with:
          name: marsel-v20-8-audit
          path: marsel-data-discovery-v20-8.json
          if-no-files-found: error
          retention-days: 30
