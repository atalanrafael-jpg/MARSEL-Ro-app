name: ReadMe ROAPP API Sync

on:
  push:
    branches: [main]
    paths:
      - "scripts/marsel_official_roapp_discovery_v1.py"
      - ".github/workflows/readme-roapp-sync.yml"
      - "02_ROAPP/**"
      - "02_ROAPP_TECHNICAL_MASTER.md"
      - "API.md"
  pull_request:
    branches: [main]
    paths:
      - "scripts/marsel_official_roapp_discovery_v1.py"
      - ".github/workflows/readme-roapp-sync.yml"
      - "02_ROAPP/**"
      - "02_ROAPP_TECHNICAL_MASTER.md"
      - "API.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-roapp-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  ROAPP_OPENAPI_JSON_URL: https://roapp.readme.io/openapi.json
  ROAPP_OPENAPI_YAML_URL: https://roapp.readme.io/openapi.yaml
  ROAPP_LLMS_URL: https://roapp.readme.io/llms.txt

jobs:
  validate-roapp-contract:
    name: Validate official ROAPP documentation discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover official ROAPP documentation endpoints
        run: python scripts/marsel_official_roapp_discovery_v1.py

      - name: Verify official ROAPP documentation index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("marsel-official-roapp-discovery-v1.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("official_llms_available") is not True:
              raise SystemExit("Official RO App llms.txt is unavailable")

          sources = {item.get("url"): item for item in data.get("sources", [])}
          for url in ("https://roapp.readme.io/openapi.json", "https://roapp.readme.io/openapi.yaml"):
              item = sources.get(url, {})
              print(f"{url}: status={item.get('http_status', 'unavailable')}")

          if data.get("openapi_available") is not True:
              print("OPENAPI_SOURCE_UNAVAILABLE: the public RO App ReadMe publication does not currently expose openapi.json/openapi.yaml.")
              print("The pipeline will not fabricate or upload a replacement specification.")
          else:
              print("OPENAPI_SOURCE_AVAILABLE=True")
          PY

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roapp-readme-contract-${{ github.run_id }}
          path: marsel-official-roapp-discovery-v1.json
          if-no-files-found: error
          retention-days: 30

  sync-readme:
    name: Sync validated ROAPP OpenAPI to ReadMe
    needs: validate-roapp-contract
    if: ${{ needs.validate-roapp-contract.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse sync without an official OpenAPI source
        shell: bash
        run: |
          set -euo pipefail
          echo "ROAPP OpenAPI synchronization is blocked: the official public ReadMe OpenAPI JSON/YAML endpoints are unavailable."
          echo "No substitute or generated specification will be uploaded automatically."
          exit 1
