name: MARSEL Chrome 153 Compatibility

on:
  push:
    branches: [main, 'marsel/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-153-compatibility:
    name: Chrome 153 compatibility guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Chrome 153 compatibility guard
        run: python scripts/marsel_chrome_153_compatibility_guard.py
