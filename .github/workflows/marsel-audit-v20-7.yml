name: MARSEL V20.7 full pagination read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/marsel_audit_v20_7.py'
      - '.github/workflows/marsel-audit-v20-7.yml'

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      ROAPP_API_BASE: https://api.roapp.io/v2
      ROAPP_TIMEOUT: '30'
      MARSEL_AUDIT_OUTPUT: marsel-data-discovery-v20-7.json
      MARSEL_PAGE_SIZE: '100'
      MARSEL_MAX_PAGES: '100'
      # Full list discovery remains enabled. Detail checks are a bounded validation sample;
      # checking 2,000 details per entity made the workflow unnecessarily slow and prone to timeout.
      MARSEL_MAX_DETAIL: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python -m py_compile scripts/marsel_audit_v20_7.py

      - name: Run MARSEL V20.7 read-only audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/marsel_audit_v20_7.py --readonly

      - name: Validate report
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MARSEL_AUDIT_OUTPUT"
          python - <<'PY'
          import json, os
          path = os.environ["MARSEL_AUDIT_OUTPUT"]
          with open(path, encoding="utf-8") as fh:
              report = json.load(fh)
          assert report.get("version") == "20.7"
          assert report.get("readonly") is True
          assert report.get("write_requests_made") is False
          assert report.get("ro_app_data_mutated") is False
          assert report.get("method_policy", {}).get("allowed") == ["GET"]
          print("REPORT_VALID=1")
          print("READ_ONLY=1")
          print("WRITE_REQUESTS_MADE=0")
          PY

      - name: Upload V20.7 report
        uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-7-audit
          if-no-files-found: error
          path: marsel-data-discovery-v20-7.json
          compression-level: 6

# V20.7: GET-only / read-only. Full list pagination is retained; detail validation is bounded to 100/entity.
