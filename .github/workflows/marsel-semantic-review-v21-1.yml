name: MARSEL V21.1 Semantic Review (READ ONLY)

on:
  push:
    branches: [audit/marsel-v20-35-followup]
    paths:
      - 'scripts/marsel_semantic_review_v21_1.py'
      - '.github/workflows/marsel-semantic-review-v21-1.yml'
  pull_request:
    paths:
      - 'scripts/marsel_semantic_review_v21_1.py'
      - '.github/workflows/marsel-semantic-review-v21-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: marsel-semantic-review-v21-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download verified V20.36 evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          artifact_id=9037049287
          expected_name='marsel-v20-36-entity-inventory'
          expected_sha='10a7eb9896cc10e4017e674f367041b757b8cb2c'
          meta="$(gh api "/repos/${repo}/actions/artifacts/${artifact_id}")"
          python - <<'PY' "$meta" "$expected_name" "$expected_sha"
          import json, sys
          meta=json.loads(sys.argv[1])
          assert meta['name'] == sys.argv[2]
          assert meta['expired'] is False
          assert meta['workflow_run']['head_sha'] == sys.argv[3]
          print('V20.36 artifact metadata verified')
          PY
          gh api "/repos/${repo}/actions/artifacts/${artifact_id}/zip" > evidence.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('evidence.zip') as z:
              names=z.namelist()
              target='marsel-entity-inventory-v20-19.json'
              assert target in names, f'{target} not found in artifact: {names}'
              z.extract(target, '.')
          print('V20.36 evidence artifact acquired:', artifact_id)
          print('SOURCE_HEAD_SHA=', expected_sha)
          PY
      - name: Run semantic review
        env:
          MARSEL_ENTITY_INVENTORY_INPUT: marsel-entity-inventory-v20-19.json
          MARSEL_SEMANTIC_REVIEW_OUTPUT: marsel-semantic-review-v21-1.json
        run: python scripts/marsel_semantic_review_v21_1.py
      - name: Validate zero-write contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marsel-semantic-review-v21-1.json',encoding='utf-8'))
          assert d['version']=='21.1'
          assert d['status']=='PASS'
          assert d['confirmed_duplicates']==0
          assert d['writes_performed']==0
          assert d['ro_app_data_mutated'] is False
          print('SEMANTIC_REVIEW_SAFETY=PASS')
          print('CANDIDATE_GROUPS=',d['duplicate_candidate_groups'])
          print('BY_ENTITY_TYPE=',d['candidate_groups_by_entity_type'])
          PY
      - name: Upload review report
        uses: actions/upload-artifact@v7
        with:
          name: marsel-v21-1-semantic-review
          path: marsel-semantic-review-v21-1.json
          if-no-files-found: error
          retention-days: 90
