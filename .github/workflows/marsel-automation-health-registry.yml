name: MARSEL Automation Health Registry

on:
  schedule:
    - cron: '45 6 * * *'
    - cron: '45 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marsel-automation-health-registry.yml'
      - 'docs/MARSEL-AUTOMATION-HEALTH-REGISTRY.md'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: marsel-automation-health-registry
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry
        run: test -s docs/MARSEL-AUTOMATION-HEALTH-REGISTRY.md

      - name: Collect latest gate results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p health
          : > health/gates.tsv
          : > health/gates-links.tsv
          failed=0

          for workflow in \
            '.github/workflows/marsel-live-probe-v20-27.yml' \
            '.github/workflows/marsel-data-quality-v20-16.yml' \
            '.github/workflows/marsel-integrity-v20-24.yml'; do
            payload="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GH_REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=1")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$payload")"
            status="$(jq -r '.workflow_runs[0].status // "UNKNOWN"' <<<"$payload")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // "UNKNOWN"' <<<"$payload")"
            html_url="$(jq -r '.workflow_runs[0].html_url // ""' <<<"$payload")"
            created="$(jq -r '.workflow_runs[0].created_at // ""' <<<"$payload")"

            if [[ -z "$run_id" ]]; then
              gate_status="UNKNOWN"
              failed=1
            elif [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              gate_status="VERIFIED"
            elif [[ "$status" == "completed" ]]; then
              gate_status="FAILED"
              failed=1
            else
              gate_status="RUNNING"
              failed=1
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$workflow" "$gate_status" "$run_id" "$status" "$conclusion" "$created" >> health/gates.tsv
            printf '%s\t%s\t%s\n' "$workflow" "$gate_status" "$html_url" >> health/gates-links.tsv
          done

          {
            echo 'MARSEL AUTOMATION HEALTH REGISTRY'
            echo "Checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            cat health/gates.tsv
          } > health/marsel-automation-health.txt

          if [[ "$failed" -ne 0 ]]; then
            echo 'HEALTH_STATUS=ATTENTION' >> "$GITHUB_ENV"
          else
            echo 'HEALTH_STATUS=PASS' >> "$GITHUB_ENV"
          fi

          cat health/marsel-automation-health.txt

      - name: Create or update diagnostic issue on failure
        if: env.HEALTH_STATUS == 'ATTENTION'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='MARSEL Automation Health — gate requires attention'
          body="$(cat health/marsel-automation-health.txt)\n\nAutomatically generated. No RO APP write operations are performed by this workflow."
          existing="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            --get --data-urlencode "state=open" --data-urlencode "per_page=20" \
            "https://api.github.com/repos/${GH_REPO}/issues?labels=automation-health")"
          issue_number="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .number' <<<"$existing" | head -n1)"
          if [[ -n "$issue_number" ]]; then
            jq -n --arg body "$body" '{body:$body}' | \
              curl -fsSL -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' "https://api.github.com/repos/${GH_REPO}/issues/${issue_number}" --data @-
          else
            jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body,labels:["automation-health"]}' | \
              curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' "https://api.github.com/repos/${GH_REPO}/issues" --data @-
          fi

      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: marsel-automation-health-registry
          path: |
            health/marsel-automation-health.txt
            health/gates.tsv
            health/gates-links.tsv
          retention-days: 30
