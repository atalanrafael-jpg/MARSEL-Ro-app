name: MARSEL V20.13 Deep Audit — READ ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run live deep audit
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_DEEP_AUDIT_OUTPUT: marsel-deep-audit-v20-13.json
          MARSEL_PAGE_SIZE: 100
          MARSEL_MAX_PAGES: 1000
        run: |
          set -euo pipefail
          test -n "$ROAPP_API_KEY"
          python scripts/marsel_deep_audit_v20_13_live.py
      - name: Validate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('marsel-deep-audit-v20-13.json',encoding='utf-8'))
          assert d['version']=='20.13' and d['readonly'] is True
          assert d['write_requests_made']==0 and d['ro_app_data_mutated'] is False
          assert d['summary']['request_failures']==0
          print('VALIDATION=PASS')
          print('RECORDS=',d['summary']['records'])
          print('CHANGE_SET_ITEMS=',d['summary']['change_set_items'])
          print('DEEP_AUDIT_SHA256=',d['summary']['deep_audit_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marsel-v20-13-deep-audit
          path: marsel-deep-audit-v20-13.json
