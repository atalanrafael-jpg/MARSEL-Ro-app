name: MARSEL Secret Guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan tracked text files for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            case "$file" in
              .git/*|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.pdf|*.zip|*.tar|*.gz|*.woff|*.woff2|*.ttf|*.ico) continue ;;
            esac
            if grep -IEnq '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|sk-[A-Za-z0-9]{20,})' "$file"; then
              echo "Potential credential pattern detected in: $file"
              found=1
            fi
          done < <(git ls-files -z)
          if [ "$found" -ne 0 ]; then
            echo "Secret Guard failed. Remove the credential and rotate it at the provider."
            exit 1
          fi
          echo "Secret Guard passed: no high-risk credential pattern detected in tracked text files."
